const keys = {}, keyDown = {}, keyUp = {};
document.addEventListener('keydown', e => { if (!keys[e.code]) keyDown[e.code] = true; keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; keyUp[e.code] = true; });
function clearFrame() { for (const k in keyDown) delete keyDown[k]; for (const k in keyUp) delete keyUp[k]; }
function pressed(c) { return !!keyDown[c]; }
function held(c)    { return !!keys[c]; }

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rectOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

const cam = { x:0, y:0 };
function camUpdate(px, py, levelW, snap=false) {
  const tx = clamp(px + PLAYER_W/2 - W/2, 0, levelW - W);
  const ty = clamp(py + PLAYER_H/2 - H/2, 0, 720 - H);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { cam.x = lerp(cam.x, tx, 0.18); cam.y = lerp(cam.y, ty, 0.18); }
}

let ctx;
function rect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(x-cam.x,y-cam.y,w,h); }
function rectS(x,y,w,h,c,lw=2) { ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.strokeRect(x-cam.x+0.5,y-cam.y+0.5,w-1,h-1); }
function text(str,x,y,c,size=20,align='left') {
  ctx.fillStyle=c; ctx.font=`bold ${size}px monospace`; ctx.textAlign=align; ctx.fillText(str,x,y);
}
function hud(str,x,y,c,size=20,align='left') {
  ctx.fillStyle=c; ctx.font=`bold ${size}px monospace`; ctx.textAlign=align; ctx.fillText(str,x,y);
}

function resolveX(e, plats) {
  for (const p of plats) {
    if (!rectOverlap(e.x,e.y,e.w,e.h, p[0],p[1],p[2],p[3])) continue;
    const overlapX = Math.min(e.x+e.w, p[0]+p[2]) - Math.max(e.x, p[0]);
    const overlapY = Math.min(e.y+e.h, p[1]+p[3]) - Math.max(e.y, p[1]);
    if (overlapX < overlapY) {
      if (e.x < p[0]) { e.x = p[0]-e.w; } else { e.x = p[0]+p[2]; }
      e.vx = 0;
    }
  }
}
function resolveY(e, plats) {
  e.onGround = false;
  for (const p of plats) {
    if (!rectOverlap(e.x,e.y,e.w,e.h, p[0],p[1],p[2],p[3])) continue;
    const overlapX = Math.min(e.x+e.w, p[0]+p[2]) - Math.max(e.x, p[0]);
    const overlapY = Math.min(e.y+e.h, p[1]+p[3]) - Math.max(e.y, p[1]);
    if (overlapY <= overlapX) {
      if (e.y < p[1]) { e.y = p[1]-e.h; e.vy = 0; e.onGround = true; }
      else { e.y = p[1]+p[3]; e.vy = 0; }
    }
  }
}

function mkPlayer() {
  return { x:80, y:570, vx:0, vy:0, w:PLAYER_W, h:PLAYER_H,
    onGround:false, canDjump:false, djumpUsed:false,
    lives:gs.lives, invTimer:0, respawnTimer:0,
    power:null, powerTimer:0,
    facing:1
  };
}
function updatePlayer(p, dt, plats, levelW) {
  if (p.respawnTimer > 0) { p.respawnTimer -= dt; return; }
  const spd = p.power==='speed' ? PLAYER_SPEED*1.65 : PLAYER_SPEED;
  let ax = 0;
  if (held('ArrowLeft')||held('KeyA'))  { ax=-spd; p.facing=-1; }
  if (held('ArrowRight')||held('KeyD')) { ax=spd;  p.facing=1; }
  const jumpKey = pressed('Space')||pressed('ArrowUp')||pressed('KeyW');
  if (jumpKey && p.onGround) {
    p.vy = JUMP_V; p.onGround = false;
    if (p.power==='djump') p.djumpUsed = false;
  } else if (jumpKey && !p.onGround && p.power==='djump' && !p.djumpUsed) {
    p.vy = DJUMP_V; p.djumpUsed = true;
  }
  p.vx = ax;
  p.vy = Math.min(p.vy + GRAVITY*dt, MAX_FALL);
  p.x += p.vx*dt; p.x = Math.max(0, Math.min(levelW-p.w, p.x));
  resolveX(p, plats);
  p.y += p.vy*dt;
  resolveY(p, plats);
  if (p.onGround && p.power==='djump') p.djumpUsed = false;
  if (p.invTimer > 0) p.invTimer -= dt;
  if (p.powerTimer > 0) { p.powerTimer -= dt; if (p.powerTimer<=0) p.power=null; }
}
function drawPlayer(p) {
  if (p.invTimer > 0 && Math.floor(p.invTimer*8)%2===0) return;
  const x=p.x-cam.x, y=p.y-cam.y;
  ctx.fillStyle='#8B4513'; ctx.fillRect(x,y+12,PLAYER_W,PLAYER_H-12);
  ctx.fillStyle='#D2691E'; ctx.fillRect(x+2,y,PLAYER_W-4,20);
  ctx.fillStyle='#8B4513'; ctx.fillRect(x,y-6,10,10); ctx.fillRect(x+PLAYER_W-10,y-6,10,10);
  ctx.fillStyle='#000'; ctx.fillRect(x+(p.facing>0?20:6),y+5,6,5);
  ctx.fillStyle='#000'; ctx.fillRect(x+(p.facing>0?24:8),y+12,4,3);
  if (p.power==='djump') { ctx.strokeStyle='#0ff'; ctx.lineWidth=2; ctx.strokeRect(x-1,y-7,PLAYER_W+2,PLAYER_H+7); }
  if (p.power==='speed') { ctx.strokeStyle='#0f0'; ctx.lineWidth=2; ctx.strokeRect(x-1,y-7,PLAYER_W+2,PLAYER_H+7); }
  if (p.power==='inv')   { ctx.strokeStyle='#ff0'; ctx.lineWidth=2; ctx.strokeRect(x-1,y-7,PLAYER_W+2,PLAYER_H+7); }
}

function mkEnemies(data) {
  return data.map(([ex,ey,type,range]) => ({
    x:ex, y:ey, vx:0, vy:0, w:type==='boss'?58:34, h:type==='boss'?66:38,
    onGround:false, type, range, startX:ex,
    dir:1, hp:type==='boss'?3:1, active:true,
    hitFlash:0,
    phase:'patrol', phaseTimer:3, chargeDir:1,
  }));
}
function updateEnemy(e, dt, plats, px, py, levelW) {
  if (!e.active) return;
  e.vy = Math.min(e.vy + GRAVITY*dt, MAX_FALL);
  if (e.type==='boss') {
    updateBoss(e, dt, px, py);
  } else {
    const spd = e.type==='chaser' ? 140 : 100;
    const dx = px - e.x;
    if (e.type==='chaser' && Math.abs(dx) < 260) {
      e.vx = dx > 0 ? spd : -spd;
    } else {
      if (e.x <= e.startX - e.range/2) e.dir = 1;
      if (e.x >= e.startX + e.range/2) e.dir = -1;
      e.vx = e.dir * spd;
    }
  }
  e.x += e.vx*dt; e.x = clamp(e.x, 0, levelW-e.w);
  resolveX(e, plats);
  e.y += e.vy*dt;
  resolveY(e, plats);
  if (e.hitFlash > 0) e.hitFlash -= dt;
}
function updateBoss(b, dt, px, py) {
  b.phaseTimer -= dt;
  if (b.phase==='patrol') {
    b.vx = b.dir * 80;
    if (b.x <= b.startX - b.range/2) b.dir=1;
    if (b.x >= b.startX + b.range/2) b.dir=-1;
    if (b.phaseTimer<=0) { b.phase='windup'; b.phaseTimer=0.6; b.vx=0; b.chargeDir=px<b.x?-1:1; }
  } else if (b.phase==='windup') {
    b.vx=0;
    if (b.phaseTimer<=0) { b.phase='charge'; b.phaseTimer=0.7; }
  } else if (b.phase==='charge') {
    b.vx = b.chargeDir * 380;
    if (b.phaseTimer<=0) { b.phase='rest'; b.phaseTimer=1.2; b.vx=0; }
  } else if (b.phase==='rest') {
    b.vx=0;
    if (b.phaseTimer<=0) { b.phase='patrol'; b.phaseTimer=3.0; }
  }
}
function drawEnemy(e) {
  if (!e.active) return;
  const x=e.x-cam.x, y=e.y-cam.y;
  if (e.type==='boss') {
    const c = e.hitFlash>0 ? '#fff' : '#8B0000';
    ctx.fillStyle=c; ctx.fillRect(x,y+16,e.w,e.h-16);
    ctx.fillStyle=c; ctx.fillRect(x+6,y,e.w-12,24);
    ctx.fillStyle='#FFD700';
    ctx.fillRect(x+8,y-8,6,10); ctx.fillRect(x+26-3,y-12,8,14); ctx.fillRect(x+e.w-14,y-8,6,10);
    ctx.fillStyle='#FF4500'; ctx.fillRect(x+8,y+4,10,8); ctx.fillRect(x+e.w-18,y+4,10,8);
    ctx.fillStyle='#400'; ctx.fillRect(x-5,y-22,e.w+10,8);
    ctx.fillStyle='#0a0'; ctx.fillRect(x-5,y-22,(e.w+10)*(e.hp/3),8);
    ctx.strokeStyle='#000'; ctx.lineWidth=1; ctx.strokeRect(x-5,y-22,e.w+10,8);
  } else {
    const c = e.type==='chaser' ? '#cc3300' : '#884400';
    ctx.fillStyle=c; ctx.fillRect(x,y,e.w,e.h);
    ctx.fillStyle='#000'; ctx.fillRect(x+6,y+8,6,6); ctx.fillRect(x+e.w-12,y+8,6,6);
    ctx.fillStyle='#fff'; ctx.fillRect(x+8,y+18,e.w-16,4);
  }
}

function mkCollectibles(coins, stars, powerups) {
  const items = [];
  for (const [cx,cy] of coins)   items.push({x:cx,y:cy,w:20,h:20,type:'coin',taken:false,bob:Math.random()*Math.PI*2});
  for (const [sx,sy] of stars)   items.push({x:sx,y:sy,w:24,h:24,type:'star',taken:false,bob:Math.random()*Math.PI*2});
  for (const [ux,uy,ut] of powerups) items.push({x:ux,y:uy,w:28,h:28,type:ut,taken:false,bob:Math.random()*Math.PI*2});
  return items;
}
function drawCollectible(it, t) {
  if (it.taken) return;
  const bob = Math.sin(t*3+it.bob)*4;
  const cx = it.x-cam.x+it.w/2, cy = it.y-cam.y+it.h/2+bob;
  if (it.type==='coin') {
    ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFA500'; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
  } else if (it.type==='star') {
    ctx.fillStyle='#FFD700';
    drawStar(cx,cy,12,6,5);
  } else {
    const colors = {djump:'#0ff',speed:'#0f0',inv:'#FFD700'};
    const labels = {djump:'2x',speed:'→→',inv:'★'};
    ctx.fillStyle=colors[it.type]||'#fff';
    ctx.fillRect(it.x-cam.x, it.y-cam.y+bob, it.w, it.h);
    ctx.fillStyle='#000'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
    ctx.fillText(labels[it.type]||'?', cx, cy+4);
  }
}
function drawStar(cx,cy,outer,inner,pts) {
  ctx.beginPath();
  for (let i=0;i<pts*2;i++) {
    const r = i%2===0?outer:inner;
    const a = (i/pts)*Math.PI - Math.PI/2;
    if (i===0) ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    else ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
}

function drawGoal(gx, gy) {
  rect(gx+16,gy-160,4,160,'#aaa');
  rect(gx+20,gy-160,28,20,'#0f0');
  rect(gx,gy,40,80,'rgba(0,255,0,0.3)');
}

function drawBg(bg, levelW) {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, bg[1]); grad.addColorStop(1, bg[0]);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.15)';
  const off = cam.x*0.3;
  for (let i=0;i<20;i++) {
    const cx2=((i*400+200)-off%levelW+levelW)%levelW - cam.x;
    if (cx2>-200&&cx2<W+200) {
      ctx.fillRect(cx2,60+((i*73)%120),80+((i*37)%60),20);
      ctx.fillRect(cx2+20,45+((i*73)%120),50,20);
    }
  }
}
function drawPlatforms(plats, world) {
  const cols = [['#3d7a2a','#2d5a1b'],['#4a3520','#2d1f0f'],['#b0c8e0','#8aaac0']];
  const [top,side] = cols[world]||cols[0];
  for (const [px,py,pw,ph] of plats) {
    ctx.fillStyle=side; ctx.fillRect(px-cam.x,py-cam.y,pw,ph);
    ctx.fillStyle=top;  ctx.fillRect(px-cam.x,py-cam.y,pw,Math.min(8,ph));
  }
}

let player, enemies, items, goalPos, levelData, gameTimer;

function startLevel() {
  levelData = mkLevel(gs.world, gs.level);
  player = mkPlayer();
  player.lives = gs.lives;
  enemies = mkEnemies(levelData.enemies);
  items = mkCollectibles(levelData.coins, levelData.stars, levelData.powerups);
  goalPos = levelData.goal;
  gameTimer = 0;
  camUpdate(player.x, player.y, levelData.levelW, true);
}

function updateGameplay(dt) {
  gameTimer += dt;
  const ld = levelData;
  updatePlayer(player, dt, ld.platforms, ld.levelW);
  for (const e of enemies) updateEnemy(e, dt, ld.platforms, player.x, player.y, ld.levelW);
  for (const it of items) {
    if (it.taken) continue;
    if (!rectOverlap(player.x,player.y,player.w,player.h, it.x,it.y,it.w,it.h)) continue;
    it.taken = true;
    if (it.type==='coin')  { gs.score+=COIN_PTS; gs.coins++; }
    else if (it.type==='star') gs.score+=STAR_PTS;
    else { player.power=it.type; player.powerTimer=10; if(it.type==='djump')player.djumpUsed=false; }
  }
  if (player.invTimer<=0 && player.respawnTimer<=0 && (player.power!=='inv')) {
    for (const e of enemies) {
      if (!e.active) continue;
      if (!rectOverlap(player.x,player.y,player.w,player.h, e.x,e.y,e.w,e.h)) continue;
      const stomp = player.vy>=6 && (player.y+player.h) <= e.y+(e.h/2+12);
      if (stomp) {
        player.vy = STOMP_BOUNCE;
        if (e.type==='boss') {
          e.hp--; e.hitFlash=0.25; e.range = Math.floor(e.range*1.15);
          if (e.hp<=0) { e.active=false; gs.score+=BOSS_PTS; }
          else gs.score+=100;
        } else { e.active=false; gs.score+=ENEMY_PTS; }
      } else {
        gs.lives--; player.lives=gs.lives;
        if (gs.lives<=0) { gs.scene='gameover'; return; }
        respawnPlayer();
      }
    }
  }
  if (player.y > 800) {
    gs.lives--; player.lives=gs.lives;
    if (gs.lives<=0) { gs.scene='gameover'; return; }
    respawnPlayer();
  }
  if (rectOverlap(player.x,player.y,player.w,player.h, goalPos[0],goalPos[1],40,80)) {
    gs.score += LEVEL_PTS;
    if (gs.score > gs.highScore) gs.highScore = gs.score;
    gs.levelDone[gs.world][gs.level] = true;
    advanceLevel();
    return;
  }
  camUpdate(player.x, player.y, ld.levelW);
  if (gs.score > gs.highScore) gs.highScore = gs.score;
  if (pressed('Escape')||pressed('KeyP')) { gs.scene='pause'; pauseSel=0; }
}

function respawnPlayer() {
  player.x=80; player.y=570; player.vx=0; player.vy=0;
  player.invTimer=2; player.respawnTimer=1.5;
  camUpdate(player.x, player.y, levelData.levelW, true);
}

function advanceLevel() {
  if (gs.level===2) {
    if (gs.world<2) gs.worldUnlocked[gs.world+1]=true;
    gs.scene='worldmap'; wmSel=gs.world; wmLvl=0;
  } else {
    gs.level++;
    startLevel();
  }
}

function drawGameplay(t) {
  const ld = levelData;
  drawBg(ld.bg, ld.levelW);
  drawPlatforms(ld.platforms, gs.world);
  for (const it of items) drawCollectible(it, t);
  drawGoal(...goalPos);
  for (const e of enemies) drawEnemy(e);
  drawPlayer(player);
  drawHUD(t);
}

function drawHUD(t) {
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,44);
  hud(`♥ ${player.lives}`,16,28,'#f66',22);
  hud(`Score: ${gs.score}`,W/2,28,'#fff',20,'center');
  hud(`Coins: ${gs.coins}`,W-16,28,'#FFD700',20,'right');
  hud(`W${gs.world+1}-${gs.level+1}`,16,H-10,'#aaa',16);
  if (player.power) {
    const pw = 160, ph = 12;
    const px2=W-pw-16, py2=H-30;
    hud(player.power.toUpperCase(), W-16, H-36, '#fff', 14, 'right');
    ctx.fillStyle='#333'; ctx.fillRect(px2,py2,pw,ph);
    ctx.fillStyle = player.power==='djump'?'#0ff':player.power==='speed'?'#0f0':'#FFD700';
    ctx.fillRect(px2,py2,pw*(player.powerTimer/10),ph);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(px2,py2,pw,ph);
  }
  if (player.respawnTimer>0) {
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
    hud('RESPAWNING...',W/2,H/2,'#fff',32,'center');
  }
}

let menuSel=0, menuT=0;
const menuItems=['PLAY','INSTRUCTIONS','QUIT'];

function updateMenu(dt) {
  menuT+=dt;
  if (pressed('ArrowUp')||pressed('KeyW'))   menuSel=(menuSel-1+3)%3;
  if (pressed('ArrowDown')||pressed('KeyS')) menuSel=(menuSel+1)%3;
  if (pressed('Enter')||pressed('Space')) {
    if (menuSel===0) { gs.scene='worldmap'; wmSel=0; wmLvl=0; }
    if (menuSel===1) { gs.scene='instructions'; }
  }
}

function drawMenu(t) {
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d2b0d'); grad.addColorStop(1,'#1a5c1a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  drawBearSil(80,H-160,60);
  drawBearSil(W-140,H-160,60);
  const bob=Math.sin(t*2)*8;
  ctx.fillStyle='#FFD700'; ctx.font='bold 72px monospace'; ctx.textAlign='center';
  ctx.fillText('SUPER BEAR ADVENTURE',W/2,160+bob);
  ctx.fillStyle='#fff'; ctx.font='24px monospace';
  ctx.fillText('A MonoGame C# Platformer',W/2,210+bob);
  for (let i=0;i<menuItems.length;i++) {
    const my=320+i*70;
    if (i===menuSel) {
      ctx.fillStyle='rgba(0,80,0,0.7)'; ctx.fillRect(W/2-120,my-36,240,48);
      ctx.fillStyle='#FFD700'; ctx.font='bold 32px monospace'; ctx.textAlign='center';
      ctx.fillText(`> ${menuItems[i]} <`,W/2,my);
    } else {
      ctx.fillStyle='#ccc'; ctx.font='28px monospace'; ctx.textAlign='center';
      ctx.fillText(menuItems[i],W/2,my);
    }
  }
  ctx.fillStyle='#0ff'; ctx.font='bold 20px monospace'; ctx.textAlign='right';
  ctx.fillText(`Best: ${gs.highScore}`,W-20,36);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='16px monospace'; ctx.textAlign='center';
  ctx.fillText('WASD/Arrows: Move   Space/W: Jump   Esc: Pause',W/2,H-20);
}

function drawBearSil(x,y,s) {
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(x,y,s*0.7,s);
  ctx.fillRect(x-s*0.1,y-s*0.35,s*0.9,s*0.4);
  ctx.fillRect(x-s*0.15,y-s*0.5,s*0.25,s*0.2);
  ctx.fillRect(x+s*0.5,y-s*0.5,s*0.25,s*0.2);
}

function drawInstructions() {
  ctx.fillStyle='#0d2b0d'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFD700'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
  ctx.fillText('INSTRUCTIONS',W/2,70);
  const lines=[
    ['MOVE','← → / A D'],['JUMP','Space / W / ↑'],['DOUBLE JUMP','Double Jump power-up + Space'],
    ['STOMP','Jump on enemies to defeat them'],['PAUSE','Esc / P'],['',''],
    ['COINS','50 pts  ★ Stars: 200 pts'],['ENEMIES','100 pts  Boss: 1000 pts'],
    ['GOAL','Reach the green flag → 500 pts'],['',''],
    ['POWER-UPS','2x=Double Jump  →→=Speed  ★=Invincible'],
  ];
  ctx.textAlign='left'; ctx.font='20px monospace';
  lines.forEach(([k,v],i)=>{
    ctx.fillStyle='#FFD700'; ctx.fillText(k,W/2-300,140+i*42);
    ctx.fillStyle='#fff'; ctx.fillText(v,W/2-60,140+i*42);
  });
  ctx.fillStyle='#aaa'; ctx.font='18px monospace'; ctx.textAlign='center';
  ctx.fillText('Press Enter or Esc to go back',W/2,H-30);
  if (pressed('Enter')||pressed('Escape')) gs.scene='menu';
}

let wmSel=0, wmLvl=0;
const worldNames=['FOREST','CAVE','SNOW'];
const worldColors=[['#2d6e1a','#1a4010'],['#2a3f5a','#0d1b2a'],['#6090b0','#3060a0']];

function updateWorldMap(dt) {
  if (pressed('ArrowLeft'))  wmSel=Math.max(0,wmSel-1);
  if (pressed('ArrowRight')) wmSel=Math.min(2,wmSel+1);
  if (pressed('ArrowUp'))    wmLvl=Math.max(0,wmLvl-1);
  if (pressed('ArrowDown'))  wmLvl=Math.min(2,wmLvl+1);
  if (pressed('Enter')||pressed('Space')) {
    if (gs.worldUnlocked[wmSel]) {
      gs.world=wmSel; gs.level=wmLvl;
      startLevel(); gs.scene='gameplay';
    }
  }
  if (pressed('Escape')) gs.scene='menu';
}

function drawWorldMap(t) {
  ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFD700'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
  ctx.fillText('SELECT WORLD',W/2,60);
  for (let wi=0;wi<3;wi++) {
    const cx=W/2+(wi-1)*340, cy=H/2-20;
    const locked=!gs.worldUnlocked[wi];
    const [c1,c2]=worldColors[wi];
    ctx.fillStyle=locked?'#333':c2;
    ctx.fillRect(cx-130,cy-160,260,300);
    ctx.strokeStyle=wi===wmSel?'#FFD700':'#555';
    ctx.lineWidth=wi===wmSel?4:2;
    ctx.strokeRect(cx-130,cy-160,260,300);
    ctx.fillStyle=locked?'#555':'#fff';
    ctx.font='bold 24px monospace'; ctx.textAlign='center';
    ctx.fillText(worldNames[wi],cx,cy-120);
    if (locked) {
      ctx.fillStyle='#888'; ctx.font='20px monospace';
      ctx.fillText('LOCKED',cx,cy);
      ctx.fillText('Complete prev world',cx,cy+30);
    } else {
      for (let lv=0;lv<3;lv++) {
        const lx=cx+(lv-1)*72, ly=cy+30;
        const sel=wi===wmSel&&lv===wmLvl;
        const done=gs.levelDone[wi][lv];
        const r=sel?16:10;
        ctx.fillStyle=done?'#FFD700':sel?'#0f0':'#fff';
        ctx.beginPath(); ctx.arc(lx,ly,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000'; ctx.font=`bold ${sel?16:12}px monospace`;
        ctx.fillText(lv+1,lx,ly+5);
        if (done) { ctx.fillStyle='#FFD700'; ctx.font='16px monospace'; ctx.fillText('★',lx,ly+30); }
      }
      ctx.fillStyle='#ccc'; ctx.font='16px monospace';
      ctx.fillText(`W${wi+1}-${wmLvl+1}`,cx,cy+90);
    }
  }
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,H-60,W,60);
  hud(`♥ ${gs.lives}  Coins:${gs.coins}  Score:${gs.score}`,W/2,H-22,'#fff',20,'center');
  hud('Enter=Select  ←→=World  ↑↓=Level  Esc=Menu',W/2,H-48,'#aaa',14,'center');
}

let pauseSel=0;
const pauseItems=['RESUME','RESTART LEVEL','MAIN MENU'];

function updatePause(dt) {
  if (pressed('ArrowUp'))   pauseSel=(pauseSel-1+3)%3;
  if (pressed('ArrowDown')) pauseSel=(pauseSel+1)%3;
  if (pressed('Escape')||pressed('KeyP')) { gs.scene='gameplay'; }
  if (pressed('Enter')||pressed('Space')) {
    if (pauseSel===0) gs.scene='gameplay';
    if (pauseSel===1) { startLevel(); gs.scene='gameplay'; }
    if (pauseSel===2) { gs.lives=3; gs.score=0; gs.coins=0; gs.scene='menu'; menuSel=0; }
  }
}

function drawPause() {
  drawBg(levelData.bg, levelData.levelW);
  drawPlatforms(levelData.platforms, gs.world);
  for (const it of items) drawCollectible(it, gameTimer);
  drawGoal(...goalPos);
  for (const e of enemies) drawEnemy(e);
  drawPlayer(player);
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(20,30,20,0.9)'; ctx.fillRect(W/2-210,H/2-160,420,320);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=3; ctx.strokeRect(W/2-210,H/2-160,420,320);
  ctx.fillStyle='#FFD700'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
  ctx.fillText('PAUSED',W/2,H/2-110);
  for (let i=0;i<pauseItems.length;i++) {
    const my=H/2-40+i*72;
    if (i===pauseSel) {
      ctx.fillStyle='rgba(0,100,0,0.6)'; ctx.fillRect(W/2-160,my-30,320,44);
      ctx.fillStyle='#FFD700'; ctx.font='bold 28px monospace';
      ctx.fillText(`> ${pauseItems[i]} <`,W/2,my);
    } else {
      ctx.fillStyle='#ccc'; ctx.font='24px monospace';
      ctx.fillText(pauseItems[i],W/2,my);
    }
  }
}

let goSel=0, goT=0;

function updateGameOver(dt) {
  goT+=dt;
  if (pressed('ArrowLeft')||pressed('ArrowRight')) goSel=(goSel+1)%2;
  if (pressed('Enter')||pressed('Space')) {
    if (goSel===0) { gs.lives=3; gs.score=0; gs.coins=0; gs.world=0; gs.level=0; startLevel(); gs.scene='gameplay'; }
    else           { gs.lives=3; gs.score=0; gs.coins=0; gs.scene='menu'; menuSel=0; }
  }
}

function drawGameOver() {
  ctx.fillStyle='#1a0000'; ctx.fillRect(0,0,W,H);
  const scale=1+Math.sin(goT*3)*0.05;
  ctx.save(); ctx.translate(W/2,H/2-80); ctx.scale(scale,scale);
  ctx.fillStyle='#ff2222'; ctx.font='bold 80px monospace'; ctx.textAlign='center';
  ctx.fillText('GAME OVER',0,0); ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='24px monospace'; ctx.textAlign='center';
  ctx.fillText(`Score: ${gs.score}   Coins: ${gs.coins}`,W/2,H/2+20);
  ctx.fillStyle='#0ff';
  ctx.fillText(`Best: ${gs.highScore}`,W/2,H/2+56);
  const btns=['TRY AGAIN','MAIN MENU'];
  for (let i=0;i<2;i++) {
    const bx=W/2+(i===0?-180:80), by=H/2+110;
    ctx.fillStyle=i===goSel?'#FFD700':'#555';
    ctx.fillRect(bx-10,by-32,160,48);
    ctx.fillStyle='#000'; ctx.font='bold 20px monospace'; ctx.textAlign='center';
    ctx.fillText(btns[i],bx+70,by);
  }
  ctx.fillStyle='#aaa'; ctx.font='16px monospace'; ctx.textAlign='center';
  ctx.fillText('← → to select   Enter to confirm',W/2,H-30);
}

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
}
window.addEventListener('resize', resize); resize();

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  ctx.clearRect(0,0,W,H);
  switch(gs.scene) {
    case 'menu': updateMenu(dt); drawMenu(ts/1000); break;
    case 'instructions': drawInstructions(); break;
    case 'worldmap': updateWorldMap(dt); drawWorldMap(ts/1000); break;
    case 'gameplay': updateGameplay(dt); drawGameplay(ts/1000); break;
    case 'pause': updatePause(dt); drawPause(); break;
    case 'gameover': updateGameOver(dt); drawGameOver(); break;
  }
  clearFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
