const keys = {}, keyDown = {}, keyUp = {};
document.addEventListener('keydown', e => { if (!keys[e.code]) keyDown[e.code] = true; keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; keyUp[e.code] = true; });
function clearFrame() { for (const k in keyDown) delete keyDown[k]; for (const k in keyUp) delete keyUp[k]; }
function pressed(c) { return !!keyDown[c]; }
function held(c)    { return !!keys[c]; }

// ── Utilities ────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rectOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
// Deterministic pseudo-random in [0,1) — used so scenery never flickers.
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

// ── Camera + screen shake ────────────────────────────────────────
const cam = { x:0, y:0 };
const shake = { t:0, dur:1, mag:0 };
function addShake(mag, dur) { shake.mag = Math.max(shake.mag, mag); shake.t = Math.max(shake.t, dur); shake.dur = Math.max(shake.dur, dur); }
function updateShake(dt) { if (shake.t > 0) { shake.t -= dt; if (shake.t <= 0) { shake.t = 0; shake.mag = 0; } } }
function camUpdate(px, py, levelW, snap=false) {
  const tx = clamp(px + PLAYER_W/2 - W/2, 0, levelW - W);
  const ty = clamp(py + PLAYER_H/2 - H/2, 0, 720 - H);
  if (snap) { cam.x = tx; cam.y = ty; }
  else { cam.x = lerp(cam.x, tx, 0.18); cam.y = lerp(cam.y, ty, 0.18); }
}

// ── Drawing Helpers ────────────────────────────────────────────
let ctx, curDt = 0.016;

function rect(x,y,w,h,c) { ctx.fillStyle=c; ctx.fillRect(x-cam.x,y-cam.y,w,h); }
function rrPath(x,y,w,h,r) {
  r = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,   x+w,y+h, r);
  ctx.arcTo(x+w,y+h, x,  y+h, r);
  ctx.arcTo(x,  y+h, x,  y,   r);
  ctx.arcTo(x,  y,   x+w,y,   r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,c) { ctx.fillStyle=c; rrPath(x,y,w,h,r); ctx.fill(); }
function strokeRR(x,y,w,h,r,c,lw=2) { ctx.strokeStyle=c; ctx.lineWidth=lw; rrPath(x,y,w,h,r); ctx.stroke(); }
function ell(cx,cy,rx,ry,c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2); ctx.fill(); }
function vgrad(x0,y0,x1,y1,stops) {
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  for (const [p,c] of stops) g.addColorStop(p,c);
  return g;
}
/** Text with a rounded outline — the standard readable-on-anything game label. */
function textOut(str,x,y,fill,size,align='left',outline='rgba(0,0,0,.75)',lw=5,font=FONT_UI) {
  ctx.font=`bold ${size}px ${font}`; ctx.textAlign=align; ctx.textBaseline='alphabetic';
  ctx.lineJoin='round'; ctx.miterLimit=2;
  if (lw > 0) { ctx.lineWidth=lw; ctx.strokeStyle=outline; ctx.strokeText(str,x,y); }
  ctx.fillStyle=fill; ctx.fillText(str,x,y);
}
function glowDot(cx,cy,r,color,alpha=1) {
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawStarPath(cx,cy,outer,inner,pts,rot=0) {
  ctx.beginPath();
  for (let i=0;i<pts*2;i++) {
    const r = i%2===0?outer:inner;
    const a = (i/pts)*Math.PI - Math.PI/2 + rot;
    if (i===0) ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
    else ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath();
}
function drawStar(cx,cy,outer,inner,pts,rot=0) { drawStarPath(cx,cy,outer,inner,pts,rot); ctx.fill(); }
function drawVignette(strength=0.38) {
  const g = ctx.createRadialGradient(W/2,H*0.5,H*0.32, W/2,H*0.5,H*0.92);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${strength})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
/** Repeats drawFn across the screen at a parallax factor — never seams, never ends. */
function parallaxRow(spacing, factor, drawFn) {
  const off = cam.x * factor;
  const first = Math.floor(off/spacing) - 1;
  const last  = Math.ceil((off + W)/spacing) + 1;
  for (let i = first; i <= last; i++) drawFn(i*spacing - off, i);
}

// ── Particles & floating score text ─────────────────────────────────
let particles = [], floaters = [];
const MAX_PARTICLES = 340;

function spawnP(o) {
  if (particles.length >= MAX_PARTICLES) particles.shift();
  particles.push(Object.assign({
    x:0, y:0, vx:0, vy:0, life:0.5, max:0.5, size:4,
    color:'#fff', grav:700, drag:1, shape:'dot', rot:0, vrot:0
  }, o));
}
function burst(x, y, n, opts) {
  for (let i=0;i<n;i++) {
    const a = (opts.angle ?? -Math.PI/2) + (Math.random()-0.5)*(opts.spread ?? Math.PI*2);
    const sp = (opts.speed ?? 140) * (0.45 + Math.random()*0.85);
    const life = (opts.life ?? 0.55) * (0.6 + Math.random()*0.7);
    spawnP({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life, max:life,
      size:(opts.size ?? 4)*(0.6+Math.random()*0.8),
      color: Array.isArray(opts.color) ? opts.color[(Math.random()*opts.color.length)|0] : (opts.color ?? '#fff'),
      grav: opts.grav ?? 700, drag: opts.drag ?? 1,
      shape: opts.shape ?? 'dot',
      rot: Math.random()*Math.PI*2, vrot:(Math.random()-0.5)*10
    });
  }
}
function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    p.vy += p.grav*dt;
    if (p.drag !== 1) { const d = Math.pow(p.drag, dt*60); p.vx *= d; p.vy *= d; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vrot*dt;
  }
  for (let i=floaters.length-1;i>=0;i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 46*dt;
    if (f.life <= 0) floaters.splice(i,1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life/p.max, 0, 1);
    const x = p.x-cam.x, y = p.y-cam.y;
    if (x < -40 || x > W+40 || y < -40 || y > H+40) continue;
    ctx.globalAlpha = a;
    if (p.shape === 'spark') {
      ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, p.size*0.5); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-p.vx*0.028, y-p.vy*0.028); ctx.stroke();
    } else if (p.shape === 'square') {
      ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore();
    } else if (p.shape === 'star') {
      ctx.fillStyle = p.color; drawStar(x, y, p.size, p.size*0.45, 5, p.rot);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(x, y, p.size*(0.35+a*0.65), 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function spawnFloat(x, y, txt, color='#ffe680', size=22) {
  floaters.push({ x, y, txt, color, size, life:0.95, max:0.95 });
}
function drawFloaters() {
  for (const f of floaters) {
    const a = clamp(f.life/f.max, 0, 1);
    ctx.globalAlpha = a;
    textOut(f.txt, f.x-cam.x, f.y-cam.y, f.color, f.size, 'center', 'rgba(0,0,0,.8)', 5);
    ctx.globalAlpha = 1;
  }
}

for (let i=0;i<70;i++) motes.push({ x:Math.random()*W, y:Math.random()*H, r:0.6+Math.random()*1.8, sp:6+Math.random()*16, sw:Math.random()*Math.PI*2 });
const leaves = [];
for (let i=0;i<34;i++) leaves.push({ x:Math.random()*W, y:Math.random()*H, s:3+Math.random()*4, sp:22+Math.random()*30, sw:Math.random()*Math.PI*2, rot:Math.random()*6.3, vr:(Math.random()-0.5)*2.4 });

function drawWeather(world, t, dt) {
  if (world === 2) {
    ctx.fillStyle = '#ffffff';
    for (const f of flakes) {
      f.y += f.sp*dt; f.sw += dt*1.6;
      if (f.y > H+6) { f.y = -6; f.x = Math.random()*W; }
      const x = f.x + Math.sin(f.sw)*f.amp*0.35 - cam.x*0.06;
      const sx = ((x % (W+40)) + (W+40)) % (W+40) - 20;
      ctx.globalAlpha = 0.55 + 0.4*Math.sin(f.sw*0.7);
      ctx.beginPath(); ctx.arc(sx, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (world === 1) {
    for (const m of motes) {
      m.y -= m.sp*dt; m.sw += dt*1.1;
      if (m.y < -6) { m.y = H+6; m.x = Math.random()*W; }
      const x = m.x + Math.sin(m.sw)*10 - cam.x*0.08;
      const sx = ((x % (W+40)) + (W+40)) % (W+40) - 20;
      ctx.globalAlpha = 0.16 + 0.3*Math.abs(Math.sin(m.sw));
      ctx.fillStyle = '#9fe8ff';
      ctx.beginPath(); ctx.arc(sx, m.y, m.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    for (const l of leaves) {
      l.y += l.sp*dt; l.sw += dt*2.0; l.rot += l.vr*dt;
      if (l.y > H+10) { l.y = -10; l.x = Math.random()*W; }
      const x = l.x + Math.sin(l.sw)*26 - cam.x*0.09;
      const sx = ((x % (W+60)) + (W+60)) % (W+60) - 30;
      ctx.save(); ctx.translate(sx, l.y); ctx.rotate(l.rot);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = ['#d98b2b','#c46a1f','#9bb03a'][(l.s|0)%3];
      ctx.beginPath(); ctx.ellipse(0,0,l.s*1.6,l.s*0.7,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

// ── Backgrounds ──────────────────────────────────────────────
function drawSky(stops) {
  ctx.fillStyle = vgrad(0,0,0,H, stops); ctx.fillRect(0,0,W,H);
}
function drawCloud(x, y, s, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(x,        y, s*1.15, s*0.62, 0, 0, Math.PI*2);
  ctx.ellipse(x+s*0.85, y+s*0.14, s*0.78, s*0.46, 0, 0, Math.PI*2);
  ctx.ellipse(x-s*0.85, y+s*0.18, s*0.68, s*0.40, 0, 0, Math.PI*2);
  ctx.ellipse(x+s*0.15, y-s*0.42, s*0.72, s*0.48, 0, 0, Math.PI*2);
  ctx.fill(); ctx.globalAlpha = 1;
}
function drawPine(x, baseY, h, wRatio, body, snowy) {
  const w = h*wRatio;
  ctx.fillStyle = '#3a2a18';
  ctx.fillRect(x-h*0.035, baseY-h*0.18, h*0.07, h*0.19);
  ctx.fillStyle = body;
  for (let tier=0; tier<3; tier++) {
    const ty = baseY - h*0.14 - tier*h*0.26;
    const tw = w*(1 - tier*0.22);
    ctx.beginPath();
    ctx.moveTo(x, ty - h*0.42);
    ctx.lineTo(x + tw/2, ty);
    ctx.lineTo(x - tw/2, ty);
    ctx.closePath(); ctx.fill();
  }
  if (snowy) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let tier=0; tier<3; tier++) {
      const ty = baseY - h*0.14 - tier*h*0.26;
      const tw = w*(1 - tier*0.22);
      ctx.beginPath();
      ctx.moveTo(x, ty - h*0.42);
      ctx.lineTo(x + tw*0.30, ty - h*0.16);
      ctx.lineTo(x - tw*0.30, ty - h*0.16);
      ctx.closePath(); ctx.fill();
    }
  }
}
function drawRidge(baseY, amp, spacing, factor, color, seed) {
  const off = cam.x*factor;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-40, H+10);
  const first = Math.floor(off/spacing) - 1;
  const last  = Math.ceil((off+W)/spacing) + 1;
  for (let i = first; i <= last; i++) {
    const px = i*spacing - off;
    const peak = baseY - amp*(0.42 + hash(i*1.7+seed)*0.58);
    ctx.lineTo(px - spacing*0.5, baseY);
    ctx.lineTo(px, peak);
  }
  ctx.lineTo(W+40, baseY); ctx.lineTo(W+40, H+10);
  ctx.closePath(); ctx.fill();
}

function drawForestBg(t, dt) {
  drawSky([[0,'#4fa8d8'],[0.42,'#8fd0e8'],[0.72,'#cbe9d8'],[1,'#e6f2cf']]);
  // sun with soft halo
  const sx = W*0.80 - cam.x*0.02, sy = H*0.17;
  glowDot(sx, sy, 190, 'rgba(255,246,190,.42)');
  glowDot(sx, sy, 78,  'rgba(255,252,225,.95)');
  // far clouds
  parallaxRow(430, 0.10, (x,i) => { if (hash(i*3.1)>0.42) drawCloud(x, 70+hash(i*5.3)*90, 26+hash(i*7.7)*22, 0.5); });
  // distant hazy hills
  drawRidge(H*0.66, 150, 300, 0.14, 'rgba(120,168,150,.55)', 3.3);
  drawRidge(H*0.72, 120, 240, 0.22, 'rgba(86,140,112,.72)', 8.1);
  // near clouds
  parallaxRow(560, 0.18, (x,i) => { if (hash(i*2.3+9)>0.5) drawCloud(x, 110+hash(i*4.1)*70, 34+hash(i*6.1)*26, 0.7); });
  // mid tree line
  parallaxRow(132, 0.36, (x,i) => {
    const h = 118 + hash(i*1.9)*66;
    drawPine(x, H*0.735, h, 0.62, '#2f6b34', false);
  });
  // near tree line — kept low and semi-transparent so it frames the playfield
  ctx.globalAlpha = 0.6;
  parallaxRow(248, 0.58, (x,i) => {
    const h = 150 + hash(i*2.7+4)*76;
    drawPine(x, H*0.885, h, 0.66, '#1d4a26', false);
  });
  ctx.globalAlpha = 1;
  // foreground bushes
  parallaxRow(150, 0.80, (x,i) => {
    const s = 34 + hash(i*3.7+2)*26;
    ctx.fillStyle = '#143a1c';
    ctx.beginPath();
    ctx.ellipse(x, H*0.985, s*1.5, s*0.85, 0, 0, Math.PI*2);
    ctx.ellipse(x+s*0.9, H*0.99, s*1.0, s*0.62, 0, 0, Math.PI*2);
    ctx.fill();
  });
  drawWeather(0, t, dt);
}

function drawCaveBg(t, dt) {
  drawSky([[0,'#04070d'],[0.45,'#0b1626'],[1,'#152a3f']]);
  // deep wall arches
  parallaxRow(260, 0.12, (x,i) => {
    ctx.fillStyle = 'rgba(30,52,76,.55)';
    ctx.beginPath(); ctx.ellipse(x, H*0.62, 150+hash(i*1.3)*90, 210+hash(i*2.9)*130, 0, 0, Math.PI*2); ctx.fill();
  });
  // glowing crystal clusters
  parallaxRow(300, 0.28, (x,i) => {
    if (hash(i*5.1) < 0.42) return;
    // anchored near the cave floor so the clusters grow out of the rock
    const baseY = H*0.74 + hash(i*3.3)*90;
    const hcol = hash(i*7.7);
    const ci = hcol > 0.66 ? 0 : hcol > 0.33 ? 1 : 2;
    const col  = ['#7ce0ff','#b48cff','#5fffc8'][ci];
    const glow = ['rgba(124,224,255,.38)','rgba(180,140,255,.38)','rgba(95,255,200,.38)'][ci];
    glowDot(x, baseY-24, 92, glow);
    for (let k=0;k<3;k++) {
      const kx = x + (k-1)*13, kh = 30 + hash(i*11+k)*36;
      ctx.fillStyle = col; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(kx, baseY-kh);
      ctx.lineTo(kx+7, baseY-kh*0.32);
      ctx.lineTo(kx+4, baseY);
      ctx.lineTo(kx-4, baseY);
      ctx.lineTo(kx-7, baseY-kh*0.32);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  });
  // stalactites from the ceiling
  parallaxRow(96, 0.44, (x,i) => {
    const h = 46 + hash(i*1.7+5)*118;
    ctx.fillStyle = '#12212f';
    ctx.beginPath(); ctx.moveTo(x-16, -4); ctx.lineTo(x+16, -4); ctx.lineTo(x, h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(120,170,210,.10)';
    ctx.beginPath(); ctx.moveTo(x-16,-4); ctx.lineTo(x-4,-4); ctx.lineTo(x-2,h*0.6); ctx.closePath(); ctx.fill();
  });
  // light shafts
  ctx.globalAlpha = 0.055;
  parallaxRow(520, 0.20, (x) => {
    ctx.fillStyle = '#bfe6ff';
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x+70, 0); ctx.lineTo(x+180, H); ctx.lineTo(x-30, H); ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // foreground rock teeth
  parallaxRow(180, 0.78, (x,i) => {
    const h = 40 + hash(i*4.3+7)*70;
    ctx.fillStyle = '#08111a';
    ctx.beginPath(); ctx.moveTo(x-40, H+8); ctx.lineTo(x, H-h); ctx.lineTo(x+40, H+8); ctx.closePath(); ctx.fill();
  });
  drawWeather(1, t, dt);
}

function drawSnowBg(t, dt) {
  drawSky([[0,'#2b4a7a'],[0.34,'#6b9ac8'],[0.66,'#a9cde8'],[1,'#e2f1fb']]);
  // aurora ribbons
  ctx.globalAlpha = 0.16;
  for (let b=0;b<3;b++) {
    ctx.beginPath();
    const yBase = 70 + b*46;
    ctx.moveTo(-20, yBase);
    for (let x=-20;x<=W+20;x+=40) ctx.lineTo(x, yBase + Math.sin(x*0.006 + t*0.5 + b)*26);
    for (let x=W+20;x>=-20;x-=40) ctx.lineTo(x, yBase + 34 + Math.sin(x*0.006 + t*0.5 + b)*26);
    ctx.closePath();
    ctx.fillStyle = ['#7bffd4','#8fd0ff','#c9a6ff'][b]; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // far mountains with snow caps
  const off = cam.x*0.14, spacing = 330;
  for (let i = Math.floor(off/spacing)-1; i <= Math.ceil((off+W)/spacing)+1; i++) {
    const x = i*spacing - off;
    const peak = H*0.34 + hash(i*2.1)*70;
    const base = H*0.74;
    ctx.fillStyle = '#5d7fa8';
    ctx.beginPath(); ctx.moveTo(x-190, base); ctx.lineTo(x, peak); ctx.lineTo(x+190, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eef6ff';
    ctx.beginPath();
    ctx.moveTo(x, peak);
    ctx.lineTo(x+56, peak+(base-peak)*0.30);
    ctx.lineTo(x+28, peak+(base-peak)*0.24);
    ctx.lineTo(x+8,  peak+(base-peak)*0.34);
    ctx.lineTo(x-20, peak+(base-peak)*0.22);
    ctx.lineTo(x-52, peak+(base-peak)*0.30);
    ctx.closePath(); ctx.fill();
  }
  drawRidge(H*0.80, 90, 250, 0.26, '#8fb4d4', 5.5);
  // snowy pines — kept below the play band so platforms stay readable
  parallaxRow(148, 0.42, (x,i) => drawPine(x, H*0.775, 108+hash(i*1.9)*58, 0.62, '#2b5545', true));
  ctx.globalAlpha = 0.6;
  parallaxRow(266, 0.64, (x,i) => drawPine(x, H*0.925, 146+hash(i*3.1+3)*74, 0.66, '#1e3f36', true));
  ctx.globalAlpha = 1;
  // foreground snow drifts
  parallaxRow(230, 0.84, (x,i) => {
    const s = 50 + hash(i*4.7)*40;
    ctx.fillStyle = '#dcecf9';
    ctx.beginPath(); ctx.ellipse(x, H*1.005, s*2.1, s*0.8, 0, 0, Math.PI*2); ctx.fill();
  });
  drawWeather(2, t, dt);
}

function drawWorldBg(world, t, dt) {
  if (world === 1) drawCaveBg(t, dt);
  else if (world === 2) drawSnowBg(t, dt);
  else drawForestBg(t, dt);
}
/**
 * Atmospheric haze laid over the scenery before the playfield is drawn.
 * Pushes every background layer back so platforms, enemies and the bear
 * read as the foreground instead of competing with the trees.
 */
function hazeScrim(world) {
  const c = ['rgba(158,206,224,.30)', 'rgba(16,34,54,.30)', 'rgba(214,234,250,.34)'][world] || 'rgba(158,206,224,.30)';
  ctx.fillStyle = c; ctx.fillRect(0,0,W,H);
}

// ── Platforms ────────────────────────────────────────────────
function drawPlatform(p, world, t) {
  const [px,py,pw,ph] = p;
  const x = px-cam.x, y = py-cam.y;
  if (x > W+60 || x+pw < -60) return;

  // contact shadow
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(x+4, y+ph, pw-8, 8);

  if (world === 0) {
    // dirt body
    ctx.fillStyle = vgrad(0,y,0,y+ph, [[0,'#7a5330'],[0.35,'#5d3d21'],[1,'#3a2513']]);
    rrPath(x, y, pw, ph, 5); ctx.fill();
    // pebbles
    ctx.fillStyle = 'rgba(0,0,0,.20)';
    for (let i=0; i*26 < pw; i++) {
      const h1 = hash(px*0.13 + i*3.7);
      if (h1 < 0.42) continue;
      const dx = x + i*26 + h1*16, dy = y + 12 + hash(px*0.29+i*1.9)*(ph-16);
      if (dy > y+ph-4) continue;
      ctx.beginPath(); ctx.arc(dx, dy, 1.5+h1*2.4, 0, Math.PI*2); ctx.fill();
    }
    // grass cap
    const gh = Math.min(11, ph);
    ctx.fillStyle = vgrad(0,y,0,y+gh, [[0,'#79d14f'],[1,'#3f8a34']]);
    rrPath(x, y, pw, gh, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(x+3, y+1, pw-6, 2);
    // grass blades swaying on the lip
    ctx.fillStyle = '#4fa53c';
    for (let i=0; i*13 < pw; i++) {
      const h1 = hash(px*0.07 + i*5.1);
      if (h1 < 0.34) continue;
      const bx = x + i*13 + h1*6;
      if (bx > x+pw-4) continue;
      const bh = 5 + h1*8;
      const sway = Math.sin(t*1.7 + i*0.8 + px*0.01)*2.6;
      ctx.beginPath();
      ctx.moveTo(bx-2, y+1); ctx.lineTo(bx+sway, y-bh); ctx.lineTo(bx+2, y+1);
      ctx.closePath(); ctx.fill();
    }
  } else if (world === 1) {
    // rock body
    ctx.fillStyle = vgrad(0,y,0,y+ph, [[0,'#75809a'],[0.4,'#4b5468'],[1,'#252b38']]);
    rrPath(x, y, pw, ph, 4); ctx.fill();
    // cracks
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5;
    for (let i=0; i*44 < pw; i++) {
      const h1 = hash(px*0.11 + i*2.3);
      if (h1 < 0.45) continue;
      const cx0 = x + i*44 + h1*22;
      ctx.beginPath();
      ctx.moveTo(cx0, y+4);
      ctx.lineTo(cx0 + (h1-0.5)*14, y + ph*0.5);
      ctx.lineTo(cx0 + (h1-0.5)*22, y + ph-3);
      ctx.stroke();
    }
    // lit top edge
    ctx.fillStyle = '#a3b1c8'; ctx.fillRect(x+2, y, pw-4, 3);
    ctx.fillStyle = 'rgba(180,220,250,.28)'; ctx.fillRect(x+2, y+3, pw-4, 2);
    // luminous moss
    for (let i=0; i*58 < pw; i++) {
      const h1 = hash(px*0.19 + i*6.7);
      if (h1 < 0.55) continue;
      const mx = x + i*58 + h1*30;
      if (mx > x+pw-6) continue;
      const pulse = 0.5 + 0.5*Math.sin(t*2 + i);
      glowDot(mx, y+2, 13, 'rgba(110,240,210,.55)', 0.35+pulse*0.4);
      ctx.fillStyle = '#7dffd8'; ctx.globalAlpha = 0.6+pulse*0.4;
      ctx.beginPath(); ctx.arc(mx, y+2, 2.1, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else {
    // frozen rock body
    ctx.fillStyle = vgrad(0,y,0,y+ph, [[0,'#8ba2bd'],[0.4,'#5f7592'],[1,'#3b4a63']]);
    rrPath(x, y, pw, ph, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for (let i=0; i*36 < pw; i++) {
      const h1 = hash(px*0.17 + i*4.1);
      if (h1 < 0.5) continue;
      ctx.fillRect(x + i*36 + h1*18, y + 10 + h1*(ph-18), 10+h1*14, 2);
    }
    // snow cap with a soft wavy crest
    const sh = Math.min(13, ph);
    ctx.fillStyle = vgrad(0,y-4,0,y+sh, [[0,'#ffffff'],[1,'#cfe3f4']]);
    ctx.beginPath();
    ctx.moveTo(x, y+sh);
    ctx.lineTo(x, y+2);
    for (let bx=0; bx<=pw; bx+=18) {
      ctx.quadraticCurveTo(x+bx+9, y - 2 - hash(px*0.05+bx*0.3)*4, x+Math.min(bx+18,pw), y+1);
    }
    ctx.lineTo(x+pw, y+sh);
    ctx.closePath(); ctx.fill();
    // icicles under thin ledges
    if (ph <= 24) {
      ctx.fillStyle = 'rgba(214,238,255,.85)';
      for (let i=0; i*30 < pw; i++) {
        const h1 = hash(px*0.23 + i*7.3);
        if (h1 < 0.55) continue;
        const ix = x + i*30 + h1*16, il = 6 + h1*14;
        if (ix > x+pw-5) continue;
        ctx.beginPath(); ctx.moveTo(ix-3.5, y+ph); ctx.lineTo(ix+3.5, y+ph); ctx.lineTo(ix, y+ph+il); ctx.closePath(); ctx.fill();
      }
    }
  }
}
function drawPlatforms(plats, world, t) { for (const p of plats) drawPlatform(p, world, t); }

// ── Physics ──────────────────────────────────────────────────
function resolveX(e, plats) {
  for (const p of plats) {
    if (!rectOverlap(e.x,e.y,e.w,e.h, p[0],p[1],p[2],p[3])) continue;
    const overlapX = Math.min(e.x+e.w, p[0]+p[2]) - Math.max(e.x, p[0]);
    const overlapY = Math.min(e.y+e.h, p[1]+p[3]) - Math.max(e.y, p[1]);
    if (overlapX < overlapY) {
      if (e.x < p[0]) { e.x = p[0]-e.w; } else { e.x = p[0]+p[2]; }
      e.vx = 0;
    }
  }
}
function resolveY(e, plats) {
  e.onGround = false;
  for (const p of plats) {
    if (!rectOverlap(e.x,e.y,e.w,e.h, p[0],p[1],p[2],p[3])) continue;
    const overlapX = Math.min(e.x+e.w, p[0]+p[2]) - Math.max(e.x, p[0]);
    const overlapY = Math.min(e.y+e.h, p[1]+p[3]) - Math.max(e.y, p[1]);
    if (overlapY <= overlapX) {
      if (e.y < p[1]) { e.y = p[1]-e.h; e.vy = 0; e.onGround = true; }
      else { e.y = p[1]+p[3]; e.vy = 0; }
    }
  }
}
/** Nearest platform surface below a box — used for drop shadows. */
function groundYBelow(x, w, y, plats) {
  let best = Infinity;
  for (const p of plats) {
    if (x + w > p[0] && x < p[0]+p[2] && p[1] >= y - 2) best = Math.min(best, p[1]);
  }
  return best;
}

// ── Player ───────────────────────────────────────────────────
function mkPlayer() {
  return { x:80, y:570, vx:0, vy:0, w:PLAYER_W, h:PLAYER_H,
    onGround:false, canDjump:false, djumpUsed:false,
    lives:gs.lives, invTimer:0, respawnTimer:0,
    power:null, powerTimer:0,
    facing:1,
    animT:0, wasOnGround:true, dustT:0, blink:0, blinkT:2+Math.random()*3
  };
}
function updatePlayer(p, dt, plats, levelW) {
  if (p.respawnTimer > 0) { p.respawnTimer -= dt; return; }

  // Input
  const spd = p.power==='speed' ? PLAYER_SPEED*1.65 : PLAYER_SPEED;
  let ax = 0;
  if (held('ArrowLeft')||held('KeyA'))  { ax=-spd; p.facing=-1; }
  if (held('ArrowRight')||held('KeyD')) { ax=spd;  p.facing=1; }

  const jumpKey = pressed('Space')||pressed('ArrowUp')||pressed('KeyW');
  if (jumpKey && p.onGround) {
    p.vy = JUMP_V; p.onGround = false;
    if (p.power==='djump') p.djumpUsed = false;
    burst(p.x+PLAYER_W/2, p.y+PLAYER_H, 8, { color:['#ffffff','#e8e0d0'], speed:110, spread:Math.PI*0.9, angle:Math.PI/2, size:4, life:0.35, grav:180, drag:0.9 });
  } else if (jumpKey && !p.onGround && p.power==='djump' && !p.djumpUsed) {
    p.vy = DJUMP_V; p.djumpUsed = true;
    burst(p.x+PLAYER_W/2, p.y+PLAYER_H*0.7, 16, { color:['#7cf6ff','#bff8ff','#ffffff'], speed:190, spread:Math.PI*2, size:4, life:0.45, grav:60, drag:0.9, shape:'spark' });
  }

  // Physics
  p.vx = ax;
  p.vy = Math.min(p.vy + GRAVITY*dt, MAX_FALL);
  p.x += p.vx*dt; p.x = Math.max(0, Math.min(levelW-p.w, p.x));
  resolveX(p, plats);
  const fallSpeed = p.vy;
  p.y += p.vy*dt;
  resolveY(p, plats);
  if (p.onGround && p.power==='djump') p.djumpUsed = false;

  // Landing impact
  if (p.onGround && !p.wasOnGround && fallSpeed > 260) {
    const n = clamp(Math.round(fallSpeed/90), 4, 14);
    burst(p.x+PLAYER_W/2, p.y+PLAYER_H, n, { color:['#ffffff','#d9cfbc','#bdb2a0'], speed:150, spread:Math.PI*0.75, angle:Math.PI, size:5, life:0.4, grav:520, drag:0.88 });
    if (fallSpeed > 700) addShake(4, 0.16);
  }
  p.wasOnGround = p.onGround;

  // Animation + running dust
  if (p.onGround && Math.abs(p.vx) > 1) {
    p.animT += dt * (Math.abs(p.vx)/PLAYER_SPEED) * 11;
    p.dustT -= dt;
    if (p.dustT <= 0) {
      p.dustT = 0.07;
      burst(p.x+PLAYER_W/2 - p.facing*8, p.y+PLAYER_H-2, 1, { color:'rgba(232,224,208,.85)', speed:55, spread:Math.PI*0.5, angle:-Math.PI/2 - p.facing*0.6, size:4, life:0.35, grav:120, drag:0.9 });
    }
  } else if (p.onGround) {
    p.animT = lerp(p.animT % (Math.PI*2), 0, Math.min(1, dt*10));
  } else {
    p.animT += dt*3;
  }
  p.blinkT -= dt;
  if (p.blinkT <= 0) { p.blink = 0.12; p.blinkT = 2.2 + Math.random()*3.5; }
  if (p.blink > 0) p.blink -= dt;

  // Trail while sprinting
  if (p.power === 'speed' && Math.abs(p.vx) > 1 && Math.random() < 0.5) {
    burst(p.x+PLAYER_W/2, p.y+PLAYER_H*0.6, 1, { color:'rgba(120,255,150,.7)', speed:30, spread:Math.PI, size:4, life:0.3, grav:-40, drag:0.9 });
  }

  // Timers
  if (p.invTimer > 0) p.invTimer -= dt;
  if (p.powerTimer > 0) { p.powerTimer -= dt; if (p.powerTimer<=0) p.power=null; }
}

const FUR_DARK = '#6d431f', FUR = '#8d5a2b', FUR_LIGHT = '#a86f38', BELLY = '#e0bc8c', MUZZLE = '#ecd3ac';

function drawBear(scale, animT, facing, vy, power, blink, t) {
  // Local space: origin at the feet, character faces +x, height 48.
  ctx.save();
  ctx.scale(facing, 1);
  const sw = Math.sin(animT);          // walk cycle
  const airborne = Math.abs(vy) > 4;
  const legSwing = airborne ? 3 : sw*5;
  const armSwing = airborne ? -5 : -sw*5;
  const bodyBob  = airborne ? 0 : Math.abs(sw)*1.6;

  // legs
  ctx.fillStyle = FUR_DARK;
  fillRR(-11 + legSwing, -13, 9, 13, 4, FUR_DARK);
  fillRR(  2 - legSwing, -13, 9, 13, 4, FUR_DARK);
  // paw pads
  ctx.fillStyle = '#4d2e14';
  ell(-6.5 + legSwing, -1.5, 4.6, 2.2, '#4d2e14');
  ell( 6.5 - legSwing, -1.5, 4.6, 2.2, '#4d2e14');

  // back arm
  fillRR(-14, -32 + bodyBob + armSwing, 7, 16, 3.5, FUR_DARK);

  // body
  ctx.fillStyle = vgrad(0,-34+bodyBob,0,-8+bodyBob, [[0,FUR_LIGHT],[0.55,FUR],[1,FUR_DARK]]);
  rrPath(-14, -34 + bodyBob, 28, 27, 11); ctx.fill();
  // belly
  ell(0.5, -19 + bodyBob, 8.5, 9.5, BELLY);

  // scarf
  ctx.fillStyle = '#c8352f';
  rrPath(-13, -35 + bodyBob, 26, 7, 3); ctx.fill();
  ctx.fillStyle = '#9e2721';
  const flap = Math.sin(t*6)*3;
  ctx.beginPath();
  ctx.moveTo(-9, -33 + bodyBob);
  ctx.lineTo(-19 - Math.abs(flap)*0.6, -26 + bodyBob + flap);
  ctx.lineTo(-13, -22 + bodyBob + flap*0.4);
  ctx.closePath(); ctx.fill();

  // head group
  const hy = -44 + bodyBob;
  // ears
  ell(-8.5, hy-9, 6.2, 6.2, FUR_DARK);
  ell( 9.5, hy-9, 6.2, 6.2, FUR_DARK);
  ell(-8.5, hy-9, 3.2, 3.2, '#c98a72');
  ell( 9.5, hy-9, 3.2, 3.2, '#c98a72');
  // head
  ctx.fillStyle = vgrad(0,hy-13,0,hy+11, [[0,FUR_LIGHT],[1,FUR]]);
  rrPath(-13, hy-13, 27, 24, 11); ctx.fill();
  // muzzle
  ell(7, hy+4, 8.6, 6.6, MUZZLE);
  // nose
  ctx.fillStyle = '#241610';
  ctx.beginPath();
  ctx.moveTo(11.5, hy-0.5); ctx.lineTo(15.5, hy+2.6); ctx.lineTo(7.5, hy+2.6);
  ctx.closePath(); ctx.fill();
  // mouth
  ctx.strokeStyle = '#5a3520'; ctx.lineWidth = 1.3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(11.5, hy+3.2); ctx.quadraticCurveTo(9, hy+7, 5.5, hy+5.6); ctx.stroke();

  // eyes
  const closed = blink > 0;
  for (const ex of [-1.5, 9]) {
    if (closed) {
      ctx.strokeStyle='#241610'; ctx.lineWidth=1.7;
      ctx.beginPath(); ctx.moveTo(ex-3, hy-4); ctx.lineTo(ex+3, hy-4); ctx.stroke();
    } else {
      ell(ex, hy-4, 3.6, 4.0, '#ffffff');
      ell(ex+1.1, hy-3.6, 2.1, 2.4, '#241610');
      ell(ex+1.9, hy-4.9, 0.8, 0.9, '#ffffff');
    }
  }
  // brow line — gives the bear a bit of attitude
  ctx.strokeStyle = FUR_DARK; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-5, hy-8.6); ctx.lineTo(1.5, hy-9.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, hy-9.6); ctx.lineTo(12.5, hy-8.6); ctx.stroke();

  // front arm (drawn last so it reads in front of the body)
  fillRR(8, -32 + bodyBob - armSwing, 7.5, 16, 3.5, FUR);

  ctx.restore();
}

function drawPlayer(p, t, plats) {
  if (p.respawnTimer > 0) return;
  if (p.invTimer > 0 && Math.floor(p.invTimer*16)%2===0) return;

  const cx = p.x + PLAYER_W/2 - cam.x;
  const feet = p.y + PLAYER_H - cam.y;

  // drop shadow on the ground below
  if (plats) {
    const gy = groundYBelow(p.x, p.w, p.y + p.h, plats);
    if (gy !== Infinity) {
      const dist = clamp((gy - (p.y+p.h)) / 260, 0, 1);
      ctx.globalAlpha = 0.34 * (1 - dist*0.8);
      ell(cx, gy - cam.y + 3, 17*(1-dist*0.45), 5.5*(1-dist*0.4), '#000');
      ctx.globalAlpha = 1;
    }
  }

  // power aura behind the bear
  if (p.power) {
    const auraCol = p.power==='djump' ? 'rgba(90,225,255,.34)' : p.power==='speed' ? 'rgba(105,255,140,.34)' : 'rgba(255,215,70,.40)';
    const pulse = 1 + Math.sin(t*7)*0.09;
    glowDot(cx, feet-24, 40*pulse, auraCol);
    if (p.power === 'inv') {
      ctx.strokeStyle = `rgba(255,225,90,${0.35+0.3*Math.sin(t*10)})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(cx, feet-24, 26, 32, Math.sin(t*2)*0.3, 0, Math.PI*2); ctx.stroke();
    }
  }

  ctx.save();
  ctx.translate(cx, feet);
  // squash & stretch driven by vertical speed
  const st = clamp(1 + p.vy/5200, 0.90, 1.12);
  ctx.scale(1/st, st);
  drawBear(1, p.animT, p.facing, p.vy, p.power, p.blink, t);
  ctx.restore();
}

// ── Enemy ─────────────────────────────────────────────────────
function mkEnemies(data) {
  return data.map(([ex,ey,type,range]) => ({
    x:ex, y:ey, vx:0, vy:0, w:type==='boss'?58:34, h:type==='boss'?66:38,
    onGround:false, type, range, startX:ex,
    dir:1, hp:type==='boss'?3:1, active:true,
    hitFlash:0, animT:Math.random()*6.28,
    // boss state
    phase:'patrol', phaseTimer:3, chargeDir:1,
  }));
}
function updateEnemy(e, dt, plats, px, py, levelW) {
  if (!e.active) return;
  e.vy = Math.min(e.vy + GRAVITY*dt, MAX_FALL);

  if (e.type==='boss') {
    updateBoss(e, dt, px, py);
  } else {
    const spd = e.type==='chaser' ? 140 : 100;
    const dx = px - e.x;
    if (e.type==='chaser' && Math.abs(dx) < 260) {
      e.vx = dx > 0 ? spd : -spd;
    } else {
      if (e.x <= e.startX - e.range/2) e.dir = 1;
      if (e.x >= e.startX + e.range/2) e.dir = -1;
      e.vx = e.dir * spd;
    }
  }

  e.x += e.vx*dt; e.x = clamp(e.x, 0, levelW-e.w);
  resolveX(e, plats);
  e.y += e.vy*dt;
  resolveY(e, plats);
  if (e.hitFlash > 0) e.hitFlash -= dt;
  e.animT += dt * (2.5 + Math.abs(e.vx)*0.02);

  // boss charge kicks up dust
  if (e.type === 'boss' && e.phase === 'charge' && e.onGround && Math.random() < 0.55) {
    burst(e.x+e.w/2 - Math.sign(e.vx)*e.w*0.4, e.y+e.h, 2, { color:['#c9b8a4','#e8dccb'], speed:120, spread:Math.PI*0.6, angle:Math.PI, size:5, life:0.35, grav:400, drag:0.9 });
  }
}
function updateBoss(b, dt, px, py) {
  b.phaseTimer -= dt;
  if (b.phase==='patrol') {
    b.vx = b.dir * 80;
    if (b.x <= b.startX - b.range/2) b.dir=1;
    if (b.x >= b.startX + b.range/2) b.dir=-1;
    if (b.phaseTimer<=0) { b.phase='windup'; b.phaseTimer=0.6; b.vx=0; b.chargeDir=px<b.x?-1:1; }
  } else if (b.phase==='windup') {
    b.vx=0;
    if (b.phaseTimer<=0) { b.phase='charge'; b.phaseTimer=0.7; }
  } else if (b.phase==='charge') {
    b.vx = b.chargeDir * 380;
    if (b.phaseTimer<=0) { b.phase='rest'; b.phaseTimer=1.2; b.vx=0; }
  } else if (b.phase==='rest') {
    b.vx=0;
    if (b.phaseTimer<=0) { b.phase='patrol'; b.phaseTimer=3.0; }
  }
}

function drawEnemy(e, t, plats, px, py) {
  if (!e.active) return;
  const x = e.x-cam.x, y = e.y-cam.y;
  if (x > W+80 || x+e.w < -80) return;
  const face = e.vx < 0 ? -1 : 1;
  const flash = e.hitFlash > 0;

  // shadow
  if (plats) {
    const gy = groundYBelow(e.x, e.w, e.y+e.h, plats);
    if (gy !== Infinity) {
      const dist = clamp((gy - (e.y+e.h))/240, 0, 1);
      ctx.globalAlpha = 0.3*(1-dist*0.8);
      ell(x+e.w/2, gy-cam.y+3, e.w*0.46*(1-dist*0.4), 5*(1-dist*0.4), '#000');
      ctx.globalAlpha = 1;
    }
  }

  if (e.type === 'boss') {
    const windup = e.phase === 'windup';
    const charging = e.phase === 'charge';
    const bob = Math.sin(e.animT*1.4)*2;
    const cx = x + e.w/2, feet = y + e.h;

    // menace glow
    glowDot(cx, feet - e.h*0.5, e.w*1.15, charging ? 'rgba(255,90,50,.34)' : 'rgba(180,30,30,.22)');

    ctx.save();
    ctx.translate(cx, feet);
    ctx.scale(e.chargeDir === -1 && (charging||windup) ? -1 : face, 1);
    if (windup) ctx.scale(1.06, 0.94);

    const base = flash ? '#ffffff' : '#7d1218';
    const lite = flash ? '#ffffff' : '#a81c22';
    // legs
    fillRR(-19, -15, 13, 15, 5, flash ? '#fff' : '#5a0d12');
    fillRR(  6, -15, 13, 15, 5, flash ? '#fff' : '#5a0d12');
    // cape
    ctx.fillStyle = flash ? 'rgba(255,255,255,.8)' : '#3a0a12';
    ctx.beginPath();
    ctx.moveTo(-14, -52 + bob);
    ctx.quadraticCurveTo(-40 - Math.abs(bob)*2, -26, -22, -4);
    ctx.lineTo(10, -8); ctx.lineTo(12, -50 + bob);
    ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = vgrad(0,-52+bob,0,-10+bob, [[0,lite],[1,base]]);
    rrPath(-21, -52 + bob, 42, 44, 15); ctx.fill();
    // chest plate
    ell(2, -30 + bob, 11, 13, flash ? '#fff' : '#521016');
    ctx.fillStyle = flash ? '#fff' : '#d8a020';
    drawStar(2, -30 + bob, 8, 3.6, 5, 0);
    // head
    const hy = -60 + bob;
    ctx.fillStyle = vgrad(0,hy-12,0,hy+12, [[0,lite],[1,base]]);
    rrPath(-17, hy-12, 34, 26, 12); ctx.fill();
    // horns
    ctx.fillStyle = flash ? '#fff' : '#e8dcc0';
    ctx.beginPath(); ctx.moveTo(-16, hy-9); ctx.lineTo(-25, hy-24); ctx.lineTo(-9, hy-13); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 16, hy-9); ctx.lineTo( 25, hy-24); ctx.lineTo( 9, hy-13); ctx.closePath(); ctx.fill();
    // crown
    ctx.fillStyle = flash ? '#fff' : '#ffcf3a';
    ctx.beginPath();
    ctx.moveTo(-13, hy-11); ctx.lineTo(-13, hy-22); ctx.lineTo(-6, hy-15);
    ctx.lineTo(0, hy-26); ctx.lineTo(6, hy-15); ctx.lineTo(13, hy-22);
    ctx.lineTo(13, hy-11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : '#ff5a4a';
    ctx.beginPath(); ctx.arc(0, hy-20, 2.6, 0, Math.PI*2); ctx.fill();
    // glowing eyes
    const eg = charging ? '#fff2a0' : '#ff6a2a';
    glowDot(-7, hy-2, 11, 'rgba(255,120,40,.75)');
    glowDot( 8, hy-2, 11, 'rgba(255,120,40,.75)');
    ell(-7, hy-2, 4.4, 3.4, eg);
    ell( 8, hy-2, 4.4, 3.4, eg);
    // snarl
    ctx.fillStyle = '#1a0508';
    rrPath(-8, hy+5, 18, 6, 3); ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i=0;i<4;i++) ctx.fillRect(-7 + i*4.4, hy+5, 2.4, 4);
    ctx.restore();

    // health bar (suppressed for the instructions line-up)
    if (e.noBar) return;
    const bw = e.w + 26, bx = cx - bw/2, by = y - 30;
    fillRR(bx-2, by-2, bw+4, 13, 6, 'rgba(0,0,0,.6)');
    fillRR(bx, by, bw, 9, 4.5, '#3a0d10');
    const hpFrac = clamp(e.hp/3, 0, 1);
    ctx.fillStyle = vgrad(0,by,0,by+9, [[0,'#7dff8a'],[1,'#1f9e3a']]);
    rrPath(bx, by, bw*hpFrac, 9, 4.5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; rrPath(bx, by, bw*hpFrac, 3.5, 2); ctx.fill();
    strokeRR(bx, by, bw, 9, 4.5, 'rgba(255,255,255,.5)', 1.2);
    textOut('BOSS', cx, by-6, '#ffd45e', 13, 'center', 'rgba(0,0,0,.8)', 4);

  } else {
    const chaser = e.type === 'chaser';
    const squash = 1 + Math.sin(e.animT*2)*0.07;
    const cx = x + e.w/2, feet = y + e.h;
    // eyes track the player
    const look = clamp(((px ?? e.x) - e.x)/180, -1, 1);

    ctx.save();
    ctx.translate(cx, feet);
    ctx.scale(1/squash, squash);

    const bodyTop = chaser
      ? [[0,'#ff6a3d'],[0.55,'#d63a1a'],[1,'#8f1f0c']]
      : [[0,'#c88a3e'],[0.55,'#9a5f24'],[1,'#5f3712']];

    // feet
    ctx.fillStyle = chaser ? '#6d1608' : '#4a2a0e';
    ell(-8 + Math.sin(e.animT*4)*2.5, -1.5, 5.5, 2.8, chaser ? '#6d1608' : '#4a2a0e');
    ell( 8 - Math.sin(e.animT*4)*2.5, -1.5, 5.5, 2.8, chaser ? '#6d1608' : '#4a2a0e');

    // spikes / crest on the back
    ctx.fillStyle = chaser ? '#ffd24a' : '#7b4a1c';
    for (let i=0;i<3;i++) {
      const sxp = -12 + i*8 - face*3;
      ctx.beginPath();
      ctx.moveTo(sxp-4, -26); ctx.lineTo(sxp, -26 - (8 + i*2)); ctx.lineTo(sxp+4, -26);
      ctx.closePath(); ctx.fill();
    }

    // body
    ctx.fillStyle = flash ? '#fff' : vgrad(0,-34,0,0, bodyTop);
    rrPath(-16, -34, 32, 34, 14); ctx.fill();
    // belly highlight
    ell(0, -12, 9, 7, chaser ? 'rgba(255,190,150,.35)' : 'rgba(255,225,180,.30)');

    // eyes
    for (const ex of [-6.5, 6.5]) {
      ell(ex, -22, 5.4, 5.8, '#ffffff');
      ell(ex + look*1.8, -21.6, 2.7, 3.0, '#101010');
      ell(ex + look*1.8 + 0.9, -22.9, 0.9, 1.0, '#ffffff');
    }
    // angry brows
    ctx.strokeStyle = chaser ? '#5c1206' : '#3d2209'; ctx.lineWidth = 2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-11.5, -30); ctx.lineTo(-2.5, -26.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 11.5, -30); ctx.lineTo( 2.5, -26.5); ctx.stroke();
    // mouth with teeth
    ctx.fillStyle = '#2a0d06';
    rrPath(-7, -14, 14, 6, 3); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-5, -14); ctx.lineTo(-2.5, -9.5); ctx.lineTo(-0.5, -14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo( 1, -14); ctx.lineTo( 3.5, -9.5); ctx.lineTo( 5.5, -14); ctx.closePath(); ctx.fill();

    ctx.restore();

    if (chaser) glowDot(cx, feet-18, 30, 'rgba(255,90,40,.20)');
  }
}

// ── Collectibles & Power-ups ──────────────────────────────────────
function mkCollectibles(coins, stars, powerups) {
  const items = [];
  for (const [cx,cy] of coins)   items.push({x:cx,y:cy,w:20,h:20,type:'coin',taken:false,bob:Math.random()*Math.PI*2});
  for (const [sx,sy] of stars)   items.push({x:sx,y:sy,w:24,h:24,type:'star',taken:false,bob:Math.random()*Math.PI*2});
  for (const [ux,uy,ut] of powerups) items.push({x:ux,y:uy,w:28,h:28,type:ut,taken:false,bob:Math.random()*Math.PI*2});
  return items;
}
function drawPowerIcon(cx, cy, type, color) {
  ctx.fillStyle = color;
  if (type === 'djump') {
    for (let k=0;k<2;k++) {
      const oy = cy + 3 + k*7;
      ctx.beginPath();
      ctx.moveTo(cx, oy-7); ctx.lineTo(cx+6, oy); ctx.lineTo(cx+3, oy); ctx.lineTo(cx+3, oy+1.6);
      ctx.lineTo(cx-3, oy+1.6); ctx.lineTo(cx-3, oy); ctx.lineTo(cx-6, oy);
      ctx.closePath(); ctx.fill();
    }
  } else if (type === 'speed') {
    ctx.beginPath();
    ctx.moveTo(cx+2, cy-9); ctx.lineTo(cx-6, cy+1); ctx.lineTo(cx-1, cy+1);
    ctx.lineTo(cx-3, cy+9); ctx.lineTo(cx+6, cy-2); ctx.lineTo(cx+1, cy-2);
    ctx.closePath(); ctx.fill();
  } else {
    drawStar(cx, cy, 9, 4, 5, 0);
  }
}
function drawCollectible(it, t) {
  if (it.taken) return;
  const bob = Math.sin(t*3 + it.bob)*4;
  const cx = it.x-cam.x + it.w/2, cy = it.y-cam.y + it.h/2 + bob;
  if (cx < -50 || cx > W+50) return;

  if (it.type === 'coin') {
    const spin = Math.cos(t*3.2 + it.bob);
    const rx = Math.max(1.6, 10*Math.abs(spin));
    glowDot(cx, cy, 20, 'rgba(255,208,60,.30)');
    ctx.fillStyle = vgrad(cx-rx, cy-10, cx+rx, cy+10, [[0,'#ffe98a'],[0.5,'#ffc72c'],[1,'#d99404']]);
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, 10, 0, 0, Math.PI*2); ctx.fill();
    if (rx > 3.5) {
      ctx.strokeStyle = 'rgba(255,250,205,.85)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx*0.62, 6.2, 0, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(cx - rx*0.32, cy - 3.5, rx*0.20, 2.6, -0.5, 0, Math.PI*2); ctx.fill();
    }
  } else if (it.type === 'star') {
    const rot = t*1.6 + it.bob;
    const pulse = 1 + Math.sin(t*4 + it.bob)*0.08;
    glowDot(cx, cy, 30*pulse, 'rgba(255,220,80,.42)');
    ctx.fillStyle = '#fff3b0'; drawStar(cx, cy, 15*pulse, 6.6*pulse, 5, rot);
    ctx.fillStyle = '#ffc72c'; drawStar(cx, cy, 11.5*pulse, 5*pulse, 5, rot);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; drawStar(cx, cy-1.5, 4.6, 2, 5, rot);
    // twinkle
    const tw = (Math.sin(t*5 + it.bob) + 1)/2;
    ctx.globalAlpha = tw*0.8; ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx-20,cy); ctx.lineTo(cx+20,cy); ctx.moveTo(cx,cy-20); ctx.lineTo(cx,cy+20); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    const colors = { djump:['#7ce8ff','#1b9fd0'], speed:['#8dff9c','#1fa03f'], inv:['#ffe37a','#d19a10'] };
    const [c1,c2] = colors[it.type] || ['#fff','#888'];
    const glows = { djump:'rgba(124,232,255,.34)', speed:'rgba(141,255,156,.34)', inv:'rgba(255,227,122,.36)' };
    const pulse = 1 + Math.sin(t*5 + it.bob)*0.07;
    glowDot(cx, cy, 34*pulse, glows[it.type] || 'rgba(255,255,255,.25)');
    glowDot(cx, cy, 18*pulse, 'rgba(255,255,255,.20)');
    // orb
    const g = ctx.createRadialGradient(cx-4, cy-5, 2, cx, cy, 16*pulse);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 15*pulse, 0, Math.PI*2); ctx.fill();
    // rotating ring
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, 18*pulse, 7, t*2 + it.bob, 0, Math.PI*2); ctx.stroke();
    drawPowerIcon(cx, cy, it.type, 'rgba(20,30,40,.85)');
  }
}

// ── Goal Flag ────────────────────────────────────────────────
function drawGoal(gx, gy, t) {
  const x = gx-cam.x, y = gy-cam.y;
  if (x < -140 || x > W+140) return;

  // glowing capture column
  const g = ctx.createLinearGradient(0, y+80, 0, y-170);
  g.addColorStop(0, 'rgba(90,255,140,.34)');
  g.addColorStop(1, 'rgba(90,255,140,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y-170, 40, 250);
  // rising sparks in the column
  for (let i=0;i<7;i++) {
    const ph = (t*0.55 + i*0.143) % 1;
    const sy = y + 78 - ph*230;
    ctx.globalAlpha = (1-ph)*0.85;
    ctx.fillStyle = '#c8ffd8';
    ctx.beginPath(); ctx.arc(x + 8 + ((i*7)%26) + Math.sin(t*2+i)*3, sy, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // pole
  ctx.fillStyle = vgrad(x+15,0,x+22,0, [[0,'#e8eef4'],[0.4,'#a9b6c4'],[1,'#68737f']]);
  ctx.fillRect(x+15, y-170, 7, 172);
  fillRR(x+8, y-4, 21, 8, 3, '#5c6773');
  // finial
  glowDot(x+18.5, y-176, 16, 'rgba(255,225,120,.65)');
  ell(x+18.5, y-176, 6.5, 6.5, '#ffd44e');
  ell(x+17, y-178, 2.2, 2.2, '#fff6c8');

  // waving checkered flag
  const segs = 8, fw = 62, fh = 40, fy = y-168;
  for (let i=0;i<segs;i++) {
    const t0 = i/segs, t1 = (i+1)/segs;
    const w0 = Math.sin(t*5 - t0*3.4)*7*t0;
    const w1 = Math.sin(t*5 - t1*3.4)*7*t1;
    for (let r=0;r<3;r++) {
      const ry0 = fy + r*(fh/3) + w0*0.35;
      const ry1 = fy + r*(fh/3) + w1*0.35;
      ctx.fillStyle = ((i + r) % 2 === 0) ? '#2fd45f' : '#f2fff5';
      ctx.beginPath();
      ctx.moveTo(x+21 + t0*fw, ry0);
      ctx.lineTo(x+21 + t1*fw, ry1);
      ctx.lineTo(x+21 + t1*fw, ry1 + fh/3);
      ctx.lineTo(x+21 + t0*fw, ry0 + fh/3);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(x+21, fy, 3, fh);

  textOut('GOAL', x+20, y+40, '#d6ffe2', 15, 'center', 'rgba(0,60,20,.85)', 5);
}

// ── Gameplay Scene State ───────────────────────────────────────
let player, enemies, items, goalPos, levelData, gameTimer;
let hitFlash = 0;   // white/red full-screen flash on damage

function startLevel() {
  levelData = mkLevel(gs.world, gs.level);
  player = mkPlayer();
  player.lives = gs.lives;
  enemies = mkEnemies(levelData.enemies);
  items = mkCollectibles(levelData.coins, levelData.stars, levelData.powerups);
  goalPos = levelData.goal;
  gameTimer = 0;
  particles = []; floaters = []; hitFlash = 0;
  shake.t = 0; shake.mag = 0;
  camUpdate(player.x, player.y, levelData.levelW, true);
}

function updateGameplay(dt) {
  gameTimer += dt;
  const ld = levelData;

  updatePlayer(player, dt, ld.platforms, ld.levelW);
  for (const e of enemies) updateEnemy(e, dt, ld.platforms, player.x, player.y, ld.levelW);
  updateParticles(dt);
  updateShake(dt);
  if (hitFlash > 0) hitFlash -= dt*3.2;

  // Collectibles
  for (const it of items) {
    if (it.taken) continue;
    if (!rectOverlap(player.x,player.y,player.w,player.h, it.x,it.y,it.w,it.h)) continue;
    it.taken = true;
    const icx = it.x + it.w/2, icy = it.y + it.h/2;
    if (it.type==='coin')  {
      gs.score+=COIN_PTS; gs.coins++;
      burst(icx, icy, 10, { color:['#ffe98a','#ffc72c','#ffffff'], speed:130, spread:Math.PI*2, size:3.4, life:0.45, grav:220, drag:0.9, shape:'spark' });
      spawnFloat(icx, icy-6, `+${COIN_PTS}`, '#ffd94e', 20);
    }
    else if (it.type==='star') {
      gs.score+=STAR_PTS;
      burst(icx, icy, 26, { color:['#fff3b0','#ffc72c','#ffffff'], speed:210, spread:Math.PI*2, size:5, life:0.7, grav:150, drag:0.9, shape:'star' });
      spawnFloat(icx, icy-8, `+${STAR_PTS}`, '#fff0a0', 26);
      addShake(3, 0.15);
    }
    else {
      player.power=it.type; player.powerTimer=10; if(it.type==='djump')player.djumpUsed=false;
      const pc = it.type==='djump'?'#7ce8ff':it.type==='speed'?'#8dff9c':'#ffe37a';
      burst(icx, icy, 22, { color:[pc,'#ffffff'], speed:190, spread:Math.PI*2, size:4.4, life:0.6, grav:0, drag:0.88, shape:'spark' });
      spawnFloat(icx, icy-8, it.type==='djump'?'DOUBLE JUMP!':it.type==='speed'?'SPEED!':'INVINCIBLE!', pc, 20);
      addShake(3, 0.14);
    }
  }

  // Enemy collisions
  if (player.invTimer<=0 && player.respawnTimer<=0 && (player.power!=='inv')) {
    for (const e of enemies) {
      if (!e.active) continue;
      if (!rectOverlap(player.x,player.y,player.w,player.h, e.x,e.y,e.w,e.h)) continue;
      // Stomp?
      const stomp = player.vy>=6 && (player.y+player.h) <= e.y+(e.h/2+12);
      const ecx = e.x+e.w/2, ecy = e.y+e.h/2;
      if (stomp) {
        player.vy = STOMP_BOUNCE;
        if (e.type==='boss') {
          e.hp--;
          e.hitFlash=0.25;
          e.range = Math.floor(e.range*1.15);
          burst(ecx, ecy, 26, { color:['#ff8a4a','#ffd24a','#ffffff'], speed:250, spread:Math.PI*2, size:5.5, life:0.6, grav:420, drag:0.92 });
          addShake(11, 0.3); hitFlash = 0.5;
          if (e.hp<=0) {
            e.active=false; gs.score+=BOSS_PTS;
            burst(ecx, ecy, 60, { color:['#ffd24a','#ff5a3a','#ffffff','#ffa02a'], speed:340, spread:Math.PI*2, size:7, life:1.0, grav:400, drag:0.93 });
            spawnFloat(ecx, ecy-20, `+${BOSS_PTS}`, '#ffd24a', 34);
            addShake(20, 0.6);
          } else { gs.score+=100; spawnFloat(ecx, ecy-20, '+100', '#ffb84a', 24); }
        } else {
          e.active=false; gs.score+=ENEMY_PTS;
          burst(ecx, ecy, 18, { color: e.type==='chaser' ? ['#ff8a5a','#d63a1a','#ffffff'] : ['#c88a3e','#7b4a1c','#ffffff'], speed:200, spread:Math.PI*2, size:5, life:0.55, grav:520, drag:0.9, shape:'square' });
          spawnFloat(ecx, ecy-12, `+${ENEMY_PTS}`, '#ffe08a', 22);
          addShake(5, 0.16);
        }
      } else {
        gs.lives--; player.lives=gs.lives;
        burst(player.x+PLAYER_W/2, player.y+PLAYER_H/2, 24, { color:['#ff5a5a','#ffb0b0','#ffffff'], speed:250, spread:Math.PI*2, size:5, life:0.6, grav:400, drag:0.9, shape:'spark' });
        addShake(14, 0.35); hitFlash = 1;
        if (gs.lives<=0) { gs.scene='gameover'; return; }
        respawnPlayer();
      }
    }
  }

  // Pit death
  if (player.y > ld.levelW) { // fallback
    gs.lives--; player.lives=gs.lives;
    if (gs.lives<=0) { gs.scene='gameover'; return; }
    respawnPlayer();
  }
  if (player.y > 800) {
    gs.lives--; player.lives=gs.lives;
    addShake(10, 0.3); hitFlash = 0.8;
    if (gs.lives<=0) { gs.scene='gameover'; return; }
    respawnPlayer();
  }

  // Goal
  if (rectOverlap(player.x,player.y,player.w,player.h, goalPos[0],goalPos[1],40,80)) {
    gs.score += LEVEL_PTS;
    if (gs.score > gs.highScore) gs.highScore = gs.score;
    gs.levelDone[gs.world][gs.level] = true;
    advanceLevel();
    return;
  }

  camUpdate(player.x, player.y, ld.levelW);
  if (gs.score > gs.highScore) gs.highScore = gs.score;

  // Pause
  if (pressed('Escape')||pressed('KeyP')) { gs.scene='pause'; pauseSel=0; }
}

function respawnPlayer() {
  player.x=80; player.y=570; player.vx=0; player.vy=0;
  player.invTimer=2; player.respawnTimer=1.5;
  camUpdate(player.x, player.y, levelData.levelW, true);
}

function advanceLevel() {
  // unlock next world
  if (gs.level===2) {
    if (gs.world<2) gs.worldUnlocked[gs.world+1]=true;
    gs.scene='worldmap'; wmSel=gs.world; wmLvl=0;
  } else {
    gs.level++;
    startLevel();
  }
}

function drawWorld(t, dt) {
  const ld = levelData;
  drawWorldBg(gs.world, t, dt);
  hazeScrim(gs.world);
  // shake is applied by nudging the camera for world-space draws only
  const ox = cam.x, oy = cam.y;
  if (shake.t > 0) {
    const m = shake.mag * (shake.t/Math.max(shake.dur, 0.0001));
    cam.x += (Math.random()*2-1)*m;
    cam.y += (Math.random()*2-1)*m;
  }
  drawPlatforms(ld.platforms, gs.world, t);
  for (const it of items) drawCollectible(it, t);
  drawGoal(goalPos[0], goalPos[1], t);
  for (const e of enemies) drawEnemy(e, t, ld.platforms, player.x, player.y);
  drawPlayer(player, t, ld.platforms);
  drawParticles();
  drawFloaters();
  cam.x = ox; cam.y = oy;
  drawVignette(0.24);
  if (hitFlash > 0) {
    ctx.fillStyle = `rgba(255,70,70,${clamp(hitFlash,0,1)*0.32})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawGameplay(t, dt) {
  drawWorld(t, dt);
  drawHUD(t);
}

// ── HUD ──────────────────────────────────────────────────────
function drawHeart(cx, cy, s, filled, t) {
  const pulse = filled ? 1 + Math.sin(t*4)*0.05 : 1;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s*pulse, s*pulse);
  ctx.beginPath();
  ctx.moveTo(0, 0.85);
  ctx.bezierCurveTo(-1.25, -0.15, -0.85, -1.15, 0, -0.55);
  ctx.bezierCurveTo(0.85, -1.15, 1.25, -0.15, 0, 0.85);
  ctx.closePath();
  ctx.fillStyle = filled ? '#ff4d5e' : 'rgba(255,255,255,.16)';
  ctx.fill();
  if (filled) {
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 0.14; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-0.4, -0.35, 0.22, 0.14, -0.5, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 0.12; ctx.stroke();
  }
  ctx.restore();
}
function hudPanel(x, y, w, h, r=12) {
  ctx.fillStyle = 'rgba(10,16,24,.62)'; rrPath(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5; rrPath(x, y, w, h, r); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.06)'; rrPath(x+1, y+1, w-2, h*0.42, r); ctx.fill();
}
function drawCoinIcon(cx, cy, r) {
  ctx.fillStyle = vgrad(cx-r, cy-r, cx+r, cy+r, [[0,'#ffe98a'],[0.5,'#ffc72c'],[1,'#d99404']]);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,205,.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r*0.6, 0, Math.PI*2); ctx.stroke();
}
function drawHUD(t) {
  // lives
  hudPanel(14, 12, 22 + Math.max(3, gs.lives)*30, 44);
  for (let i=0; i<Math.max(3, gs.lives); i++) drawHeart(38 + i*30, 34, 11, i < player.lives, t);

  // score (centre)
  const scoreTxt = String(gs.score).padStart(6, '0');
  ctx.font = `bold 26px ${FONT_UI}`;
  const sw = ctx.measureText(scoreTxt).width;
  hudPanel(W/2 - sw/2 - 28, 12, sw + 56, 44);
  textOut('SCORE', W/2, 27, 'rgba(180,205,230,.85)', 11, 'center', 'rgba(0,0,0,.7)', 3);
  textOut(scoreTxt, W/2, 50, '#ffffff', 24, 'center', 'rgba(0,0,0,.8)', 5);

  // coins
  const coinTxt = `× ${gs.coins}`;
  ctx.font = `bold 22px ${FONT_UI}`;
  const cw = ctx.measureText(coinTxt).width;
  hudPanel(W - 34 - cw - 46, 12, cw + 66, 44);
  drawCoinIcon(W - 34 - cw - 22, 34, 11);
  textOut(coinTxt, W - 26, 42, '#ffd94e', 22, 'right', 'rgba(0,0,0,.8)', 5);

  // level tag
  const tag = `WORLD ${gs.world+1} — ${['FOREST','CAVE','SNOW'][gs.world]}  ·  LEVEL ${gs.level+1}`;
  ctx.font = `bold 14px ${FONT_UI}`;
  const tw = ctx.measureText(tag).width;
  hudPanel(14, H-46, tw + 28, 32, 10);
  textOut(tag, 28, H-25, 'rgba(215,232,248,.95)', 14, 'left', 'rgba(0,0,0,.75)', 4);

  // power-up meter
  if (player.power) {
    const pw = 190, ph = 14, px2 = W - pw - 30, py2 = H - 34;
    const col = player.power==='djump' ? '#5fd8ff' : player.power==='speed' ? '#6dfa86' : '#ffd94e';
    const label = player.power==='djump' ? 'DOUBLE JUMP' : player.power==='speed' ? 'SPEED BOOST' : 'INVINCIBLE';
    hudPanel(px2 - 42, py2 - 26, pw + 60, 50, 12);
    drawPowerIcon(px2 - 20, py2 + 2, player.power, col);
    textOut(label, W - 30, py2 - 6, col, 13, 'right', 'rgba(0,0,0,.8)', 4);
    fillRR(px2, py2, pw, ph, 7, 'rgba(0,0,0,.55)');
    const frac = clamp(player.powerTimer/10, 0, 1);
    if (frac > 0) {
      ctx.fillStyle = col; rrPath(px2, py2, pw*frac, ph, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; rrPath(px2+2, py2+2, Math.max(0, pw*frac-4), 4.5, 2.5); ctx.fill();
    }
    strokeRR(px2, py2, pw, ph, 7, 'rgba(255,255,255,.35)', 1.4);
  }

  if (player.respawnTimer > 0) {
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H);
    const p = 1 - clamp(player.respawnTimer/1.5, 0, 1);
    textOut('RESPAWNING', W/2, H/2-6, '#ffffff', 40, 'center', 'rgba(0,0,0,.85)', 8, FONT_TITLE);
    fillRR(W/2-130, H/2+22, 260, 10, 5, 'rgba(255,255,255,.18)');
    ctx.fillStyle = '#ffd94e'; rrPath(W/2-130, H/2+22, 260*p, 10, 5); ctx.fill();
    textOut(`${player.lives} ${player.lives === 1 ? 'LIFE' : 'LIVES'} LEFT`, W/2, H/2+62, 'rgba(255,190,190,.95)', 18, 'center', 'rgba(0,0,0,.8)', 5);
  }
}

// ── Shared menu chrome ───────────────────────────────────────────
function menuButton(cx, cy, w, h, label, selected, t, accent='#ffd44e', fill=['rgba(60,120,50,.95)','rgba(26,70,26,.95)'], glow='rgba(255,205,80,.22)') {
  const s = selected ? 1 + Math.sin(t*6)*0.018 : 1;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  if (selected) {
    glowDot(cx, cy, w*0.62, glow);
    ctx.fillStyle = vgrad(0, cy-h/2, 0, cy+h/2, [[0,fill[0]],[1,fill[1]]]);
    rrPath(cx-w/2, cy-h/2, w, h, 14); ctx.fill();
    strokeRR(cx-w/2, cy-h/2, w, h, 14, accent, 3);
    textOut(label, cx, cy + h*0.16, '#fff6cf', h*0.44, 'center', 'rgba(0,0,0,.8)', 6);
    // side arrows
    ctx.fillStyle = accent;
    const ax = w/2 + 16, wob = Math.sin(t*7)*3;
    ctx.beginPath(); ctx.moveTo(cx-ax-wob, cy-8); ctx.lineTo(cx-ax-wob+11, cy); ctx.lineTo(cx-ax-wob, cy+8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+ax+wob, cy-8); ctx.lineTo(cx+ax+wob-11, cy); ctx.lineTo(cx+ax+wob, cy+8); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(8,16,12,.5)';
    rrPath(cx-w/2, cy-h/2, w, h, 14); ctx.fill();
    strokeRR(cx-w/2, cy-h/2, w, h, 14, 'rgba(255,255,255,.16)', 2);
    textOut(label, cx, cy + h*0.16, 'rgba(226,238,226,.82)', h*0.40, 'center', 'rgba(0,0,0,.7)', 5);
  }
  ctx.restore();
}
function titleText(str, cx, cy, size, t) {
  ctx.save();
  ctx.font = `bold ${size}px ${FONT_TITLE}`; ctx.textAlign='center'; ctx.lineJoin='round';
  // drop shadow
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(str, cx+4, cy+6);
  // heavy outline
  ctx.lineWidth = size*0.17; ctx.strokeStyle = '#2a1a06'; ctx.strokeText(str, cx, cy);
  ctx.lineWidth = size*0.08; ctx.strokeStyle = '#8a5a12'; ctx.strokeText(str, cx, cy);
  // gold gradient fill
  const g = ctx.createLinearGradient(0, cy-size*0.85, 0, cy+size*0.15);
  g.addColorStop(0,'#fff6c9'); g.addColorStop(0.45,'#ffd23f'); g.addColorStop(0.55,'#f6a81c'); g.addColorStop(1,'#ffe887');
  ctx.fillStyle = g; ctx.fillText(str, cx, cy);
  // sweeping shine
  const sweep = ((t*0.35) % 1.6) - 0.3;
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - size*6, cy-size, size*12, size*1.3); ctx.clip();
  const sg = ctx.createLinearGradient(cx - size*6 + sweep*size*12, 0, cx - size*6 + sweep*size*12 + size*1.6, 0);
  sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,.55)'); sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillText(str, cx, cy);
  ctx.restore();
  ctx.restore();
}
function hintBar(str) {
  ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(0, H-40, W, 40);
  textOut(str, W/2, H-15, 'rgba(228,240,255,.85)', 15, 'center', 'rgba(0,0,0,.8)', 4);
}

// ── Menu Scene ───────────────────────────────────────────────
let menuSel=0, menuT=0;
const menuItems=['PLAY','INSTRUCTIONS','QUIT'];

function updateMenu(dt) {
  menuT+=dt;
  updateParticles(dt);
  if (pressed('ArrowUp')||pressed('KeyW'))   menuSel=(menuSel-1+3)%3;
  if (pressed('ArrowDown')||pressed('KeyS')) menuSel=(menuSel+1)%3;
  if (pressed('Enter')||pressed('Space')) {
    if (menuSel===0) { gs.scene='worldmap'; wmSel=0; wmLvl=0; }
    if (menuSel===2) { /* no quit in browser */ }
    if (menuSel===1) { gs.scene='instructions'; }

}

  hudPanel(W-206, 16, 190, 46, 12);
  drawStarPath(W-180, 39, 11, 5, 5, t*1.2); ctx.fillStyle='#ffd44e'; ctx.fill();
  textOut(`BEST  ${gs.highScore}`, W-26, 46, '#eaf6ff', 20, 'right', 'rgba(0,0,0,.8)', 5);

  drawVignette(0.42);
  hintBar('↑ ↓  Navegar     ENTER / SPACE  Seleccionar     ESC  Volver');
}

// ── Instructions ─────────────────────────────────────────────
function drawInstructions(t, dt) {
  const ox = cam.x; cam.x = t*10;
  drawForestBg(t, dt);
  cam.x = ox;
  ctx.fillStyle = 'rgba(4,10,8,.66)'; ctx.fillRect(0,0,W,H);

  titleText('INSTRUCTIONS', W/2, 82, 48, t);

  const cols = [
    { title:'CONTROLS', x: W*0.27, rows:[
      ['← →  /  A D', 'Mover'],
      ['SPACE / W / ↑', 'Saltar'],
      ['SPACE en el aire', 'Doble salto (con power-up)'],
      ['Caer encima', 'Derrotar enemigos'],
      ['ESC  /  P', 'Pausa'],
    ]},
    { title:'PUNTOS', x: W*0.73, rows:[
      ['Moneda', '50 pts'],
      ['Estrella', '200 pts'],
      ['Enemigo', '100 pts'],
      ['Jefe final', '1000 pts'],
      ['Bandera de meta', '500 pts'],
    ]},
  ];
  for (const col of cols) {
    hudPanel(col.x - 270, 130, 540, 262, 16);
    textOut(col.title, col.x, 166, '#ffd44e', 22, 'center', 'rgba(0,0,0,.8)', 5);
    col.rows.forEach(([k,v], i) => {
      const ry = 208 + i*40;
      fillRR(col.x-246, ry-21, 250, 30, 8, 'rgba(255,255,255,.08)');
      textOut(k, col.x-234, ry, '#eaf6ff', 16, 'left', 'rgba(0,0,0,.8)', 4);
      textOut(v, col.x+248, ry, 'rgba(200,224,244,.9)', 16, 'right', 'rgba(0,0,0,.8)', 4);
    });
  }

  // power-up legend with live icons
  hudPanel(W/2-390, 418, 780, 118, 16);
  textOut('POWER-UPS', W/2, 452, '#ffd44e', 20, 'center', 'rgba(0,0,0,.8)', 5);
  const pus = [
    ['djump','#7ce8ff','DOBLE SALTO','Un salto extra en el aire'],
    ['speed','#8dff9c','VELOCIDAD','Te mueves un 65% más rápido'],
    ['inv','#ffe37a','INVENCIBLE','Los enemigos no te dañan'],
  ];
  pus.forEach(([type,col,name,desc], i) => {
    const px = W/2 - 260 + i*260;
    glowDot(px, 500, 26, 'rgba(255,255,255,.12)');
    const g = ctx.createRadialGradient(px-4, 495, 2, px, 500, 16);
    g.addColorStop(0,'#fff'); g.addColorStop(0.35, col); g.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, 500, 15, 0, Math.PI*2); ctx.fill();
    drawPowerIcon(px, 500, type, 'rgba(20,30,40,.85)');
    textOut(name, px+26, 494, col, 15, 'left', 'rgba(0,0,0,.8)', 4);
    textOut(desc, px+26, 512, 'rgba(210,230,245,.8)', 12, 'left', 'rgba(0,0,0,.8)', 3);
  });

  // a live enemy line-up so the player knows what they're facing
  hudPanel(W/2-390, 552, 780, 108, 16);
  textOut('ENEMIGOS', W/2, 580, '#ff9a6a', 18, 'center', 'rgba(0,0,0,.8)', 5);
  const demo = [
    { type:'patrol', label:'PATRULLA', x:W/2-250 },
    { type:'chaser', label:'PERSEGUIDOR', x:W/2-10 },
    { type:'boss',   label:'JEFE', x:W/2+240 },
  ];
  const savedCam = { x:cam.x, y:cam.y };
  cam.x = 0; cam.y = 0;
  for (const d of demo) {
    const w = d.type==='boss'?58:34, h = d.type==='boss'?66:38;
    const scale = d.type==='boss' ? 0.62 : 0.86;
    ctx.save(); ctx.translate(d.x, 640); ctx.scale(scale, scale); ctx.translate(-d.x, -640);
    drawEnemy({ x:d.x-w/2, y:640-h, w, h, type:d.type, active:true, vx:1, hitFlash:0, animT:t*2, hp:3, phase:'patrol', noBar:true }, t, null, d.x+200, 600);
    ctx.restore();
    textOut(d.label, d.x, 656, 'rgba(226,240,252,.9)', 13, 'center', 'rgba(0,0,0,.8)', 4);
  }
  cam.x = savedCam.x; cam.y = savedCam.y;

  drawVignette(0.35);
  hintBar('ENTER o ESC para volver');
  if (pressed('Enter')||pressed('Escape')) gs.scene='menu';
}

// ── World Map ───────────────────────────────────────────────
let wmSel=0, wmLvl=0;
const worldNames=['FOREST','CAVE','SNOW'];
const worldSubs=['Bosque soleado','Cuevas de cristal','Cumbres heladas'];
const worldColors=[['#2d6e1a','#12300d'],['#2a3f5a','#0a1420'],['#5f8fbd','#22405f']];

function updateWorldMap(dt) {
  updateParticles(dt);
  if (pressed('ArrowLeft'))  wmSel=Math.max(0,wmSel-1);
  if (pressed('ArrowRight')) wmSel=Math.min(2,wmSel+1);
  if (pressed('ArrowUp'))    wmLvl=Math.max(0,wmLvl-1);
  if (pressed('ArrowDown'))  wmLvl=Math.min(2,wmLvl+1);
  if (pressed('Enter')||pressed('Space')) {
    if (gs.worldUnlocked[wmSel]) {
      gs.world=wmSel; gs.level=wmLvl;
      startLevel(); gs.scene='gameplay';
    }
  }
  if (pressed('Escape')) gs.scene='menu';
}

/** Small illustrated preview of a world, drawn inside a card. */
function worldThumb(x, y, w, h, wi, t, locked) {
  ctx.save();
  rrPath(x, y, w, h, 12); ctx.clip();
  if (wi === 0) {
    ctx.fillStyle = vgrad(0,y,0,y+h, [[0,'#6fc0e0'],[1,'#cfe9c4']]); ctx.fillRect(x,y,w,h);
    glowDot(x+w*0.78, y+h*0.24, 34, 'rgba(255,246,190,.85)');
    for (let i=0;i<6;i++) drawPine(x + 14 + i*(w/5.4) + Math.sin(t+i)*1.5, y+h-8, 52+((i*13)%22), 0.62, i%2?'#2f6b34':'#1d4a26', false);
    ctx.fillStyle='#4b8b3a'; ctx.fillRect(x, y+h-12, w, 12);
  } else if (wi === 1) {
    ctx.fillStyle = vgrad(0,y,0,y+h, [[0,'#08111c'],[1,'#16324a']]); ctx.fillRect(x,y,w,h);
    for (let i=0;i<7;i++) {
      const sx2 = x + 10 + i*(w/6.6);
      ctx.fillStyle='#12212f';
      ctx.beginPath(); ctx.moveTo(sx2-8,y); ctx.lineTo(sx2+8,y); ctx.lineTo(sx2, y+18+((i*11)%22)); ctx.closePath(); ctx.fill();
    }
    for (let i=0;i<3;i++) {
      const gx2 = x + 26 + i*(w/3.1), gy2 = y+h-22;
      glowDot(gx2, gy2, 26, 'rgba(120,225,255,.45)');
      ctx.fillStyle = ['#7ce0ff','#b48cff','#5fffc8'][i];
      ctx.beginPath(); ctx.moveTo(gx2, gy2-22); ctx.lineTo(gx2+7, gy2-6); ctx.lineTo(gx2-7, gy2-6); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='#1b2733'; ctx.fillRect(x, y+h-12, w, 12);
  } else {
    ctx.fillStyle = vgrad(0,y,0,y+h, [[0,'#3a5e92'],[1,'#d8ecfa']]); ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#5d7fa8';
    ctx.beginPath(); ctx.moveTo(x-10,y+h-14); ctx.lineTo(x+w*0.42, y+16); ctx.lineTo(x+w*0.86, y+h-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#eef6ff';
    ctx.beginPath(); ctx.moveTo(x+w*0.42,y+16); ctx.lineTo(x+w*0.55,y+40); ctx.lineTo(x+w*0.42,y+34); ctx.lineTo(x+w*0.30,y+42); ctx.closePath(); ctx.fill();
    for (let i=0;i<4;i++) drawPine(x + 20 + i*(w/3.6), y+h-8, 44, 0.62, '#22493d', true);
    ctx.fillStyle='#eaf5ff'; ctx.fillRect(x, y+h-12, w, 12);
    ctx.fillStyle='rgba(255,255,255,.85)';
    for (let i=0;i<16;i++) {
      const fy = ((t*22 + i*23) % (h+10));
      ctx.beginPath(); ctx.arc(x + ((i*37)%w), y + fy, 1.4, 0, Math.PI*2); ctx.fill();
    }
  }
  if (locked) { ctx.fillStyle='rgba(6,10,16,.72)'; ctx.fillRect(x,y,w,h); }
  ctx.restore();
}

function drawWorldMap(t, dt) {
  // subtle animated backdrop of the selected world
  const ox = cam.x, oy = cam.y;
  cam.x = t*14; cam.y = 0;
  drawWorldBg(wmSel, t, dt);
  cam.x = ox; cam.y = oy;
  ctx.fillStyle='rgba(5,9,14,.62)'; ctx.fillRect(0,0,W,H);

  titleText('SELECT WORLD', W/2, 74, 44, t);

  for (let wi=0; wi<3; wi++) {
    const cx = W/2 + (wi-1)*386, cy = H/2 + 6;
    const cw = 340, ch = 372;
    const cardX = cx - cw/2, cardY = cy - ch/2;
    const locked = !gs.worldUnlocked[wi];
    const sel = wi === wmSel;
    const [c1,c2] = worldColors[wi];

    ctx.save();
    if (sel) { const s = 1.035 + Math.sin(t*3)*0.008; ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy); }

    if (sel) glowDot(cx, cy, cw*0.82, 'rgba(255,210,80,.20)');
    // card body
    ctx.fillStyle = vgrad(0, cardY, 0, cardY+ch, [[0, locked ? '#20242c' : c1],[1, locked ? '#0f1116' : c2]]);
    rrPath(cardX, cardY, cw, ch, 18); ctx.fill();
    strokeRR(cardX, cardY, cw, ch, 18, sel ? '#ffd44e' : 'rgba(255,255,255,.15)', sel ? 3.5 : 2);

    worldThumb(cardX+14, cardY+52, cw-28, 150, wi, t, locked);

    textOut(worldNames[wi], cx, cardY+36, locked ? 'rgba(190,200,215,.6)' : '#ffffff', 26, 'center', 'rgba(0,0,0,.8)', 5);
    textOut(worldSubs[wi], cx, cardY+222, locked ? 'rgba(160,172,190,.55)' : 'rgba(220,238,252,.85)', 14, 'center', 'rgba(0,0,0,.8)', 4);

    if (locked) {
      // padlock
      const lx = cx, ly = cardY+282;
      ctx.strokeStyle='rgba(200,210,228,.7)'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(lx, ly-12, 13, Math.PI, 0); ctx.stroke();
      fillRR(lx-19, ly-12, 38, 30, 6, 'rgba(200,210,228,.75)');
      ctx.fillStyle='#20242c'; ctx.beginPath(); ctx.arc(lx, ly+1, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(lx-2, ly+1, 4, 8);
      textOut('BLOQUEADO', cx, cardY+334, 'rgba(200,210,228,.75)', 15, 'center', 'rgba(0,0,0,.8)', 4);
    } else {
      const done = gs.levelDone[wi];
      for (let lv=0; lv<3; lv++) {
        const lx = cx + (lv-1)*92, ly = cardY+286;
        const lsel = sel && lv === wmLvl;
        const r = lsel ? 27 : 22;
        if (lsel) glowDot(lx, ly, 46, 'rgba(120,255,140,.35)');
        ctx.fillStyle = done[lv]
          ? vgrad(0,ly-r,0,ly+r, [[0,'#ffe07a'],[1,'#e0a010']])
          : lsel ? vgrad(0,ly-r,0,ly+r, [[0,'#8dff9c'],[1,'#2aa347']])
                 : 'rgba(255,255,255,.16)';
        ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = lsel ? '#ffffff' : 'rgba(255,255,255,.35)'; ctx.lineWidth = lsel ? 3 : 2;
        ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI*2); ctx.stroke();
        textOut(String(lv+1), lx, ly+7, done[lv] || lsel ? '#1a2410' : 'rgba(255,255,255,.85)', lsel ? 22 : 18, 'center', 'rgba(0,0,0,.35)', 3);
        if (lv === 2) textOut('BOSS', lx, ly+r+16, '#ff9a6a', 11, 'center', 'rgba(0,0,0,.8)', 3);
        if (done[lv]) { ctx.fillStyle='#ffd44e'; drawStar(lx+r-4, ly-r+4, 8, 3.6, 5, t*1.5); }
      }
      const stars = done.filter(Boolean).length;
      textOut(`${stars} / 3 COMPLETADOS`, cx, cardY+348, stars===3 ? '#ffd44e' : 'rgba(215,232,248,.8)', 14, 'center', 'rgba(0,0,0,.8)', 4);
    }
    ctx.restore();
  }

  // stats bar
  ctx.fillStyle='rgba(6,10,16,.75)'; ctx.fillRect(0, H-72, W, 72);
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,H-72); ctx.lineTo(W,H-72); ctx.stroke();
  for (let i=0;i<Math.max(3, gs.lives);i++) drawHeart(40 + i*30, H-46, 11, i < gs.lives, t);
  drawCoinIcon(200, H-46, 11);
  textOut(`× ${gs.coins}`, 218, H-39, '#ffd94e', 20, 'left', 'rgba(0,0,0,.8)', 5);
  textOut(`SCORE  ${gs.score}`, W/2, H-39, '#ffffff', 20, 'center', 'rgba(0,0,0,.8)', 5);
  textOut(`BEST  ${gs.highScore}`, W-26, H-39, '#7fe8ff', 20, 'right', 'rgba(0,0,0,.8)', 5);
  textOut('← →  Mundo     ↑ ↓  Nivel     ENTER  Jugar     ESC  Menú', W/2, H-12, 'rgba(200,220,240,.8)', 14, 'center', 'rgba(0,0,0,.8)', 4);

  drawVignette(0.34);
}

// ── Pause Scene ──────────────────────────────────────────────
let pauseSel=0;
const pauseItems=['RESUME','RESTART LEVEL','MAIN MENU'];

function updatePause(dt) {
  if (pressed('ArrowUp'))   pauseSel=(pauseSel-1+3)%3;
  if (pressed('ArrowDown')) pauseSel=(pauseSel+1)%3;
  if (pressed('Escape')||pressed('KeyP')) { gs.scene='gameplay'; }
  if (pressed('Enter')||pressed('Space')) {
    if (pauseSel===0) gs.scene='gameplay';
    if (pauseSel===1) { startLevel(); gs.scene='gameplay'; }
    if (pauseSel===2) { gs.lives=3; gs.score=0; gs.coins=0; gs.scene='menu'; menuSel=0; }
  }
}

function drawPause(t, dt) {
  drawWorld(gameTimer, 0);   // frozen world underneath
  ctx.fillStyle='rgba(4,8,14,.70)'; ctx.fillRect(0,0,W,H);

  const bw = 460, bh = 366, bx = W/2-bw/2, by = H/2-bh/2;
  ctx.fillStyle = vgrad(0, by, 0, by+bh, [[0,'rgba(24,40,28,.96)'],[1,'rgba(10,20,14,.96)']]);
  rrPath(bx, by, bw, bh, 20); ctx.fill();
  strokeRR(bx, by, bw, bh, 20, '#ffd44e', 3);
  ctx.fillStyle='rgba(255,255,255,.05)'; rrPath(bx+2, by+2, bw-4, bh*0.30, 18); ctx.fill();

  titleText('PAUSED', W/2, by+70, 42, t);
  textOut(`WORLD ${gs.world+1}-${gs.level+1}  ·  SCORE ${gs.score}`, W/2, by+100, 'rgba(215,232,248,.8)', 15, 'center', 'rgba(0,0,0,.8)', 4);

  for (let i=0;i<pauseItems.length;i++) {
    menuButton(W/2, by+164 + i*68, 336, 52, pauseItems[i], i===pauseSel, t);
  }
  textOut('ESC para continuar', W/2, by+bh-18, 'rgba(190,210,230,.7)', 13, 'center', 'rgba(0,0,0,.8)', 4);
}

// ── Game Over ───────────────────────────────────────────────
let goSel=0, goT=0;

function updateGameOver(dt) {
  goT+=dt;
  updateParticles(dt);
  if (pressed('ArrowLeft')||pressed('ArrowRight')) goSel=(goSel+1)%2;
  if (pressed('Enter')||pressed('Space')) {
    if (goSel===0) { gs.lives=3; gs.score=0; gs.coins=0; gs.world=0; gs.level=0; startLevel(); gs.scene='gameplay'; }
    else           { gs.lives=3; gs.score=0; gs.coins=0; gs.scene='menu'; menuSel=0; }
  }
}

function drawGameOver(t) {
  ctx.fillStyle = vgrad(0,0,0,H, [[0,'#2a0708'],[0.55,'#14040a'],[1,'#050103']]); ctx.fillRect(0,0,W,H);
  // slow embers
  for (let i=0;i<40;i++) {
    const ph = (goT*0.16 + i*0.025) % 1;
    const ex = (i*137)%W + Math.sin(goT + i)*22;
    ctx.globalAlpha = (1-ph)*0.5;
    ctx.fillStyle = i%3 ? '#ff7a3a' : '#ffc24a';
    ctx.beginPath(); ctx.arc(ex, H - ph*H, 1.4 + (i%3), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  const s = 1 + Math.sin(goT*3)*0.035;
  ctx.translate(W/2, H/2-130); ctx.scale(s,s); ctx.translate(-W/2, -(H/2-130));
  ctx.font = `bold 96px ${FONT_TITLE}`; ctx.textAlign='center'; ctx.lineJoin='round';
  ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillText('GAME OVER', W/2+5, H/2-124);
  ctx.lineWidth=16; ctx.strokeStyle='#3a0508'; ctx.strokeText('GAME OVER', W/2, H/2-130);
  const g = ctx.createLinearGradient(0, H/2-210, 0, H/2-110);
  g.addColorStop(0,'#ff9a8a'); g.addColorStop(0.5,'#ef2b2b'); g.addColorStop(1,'#8e0d12');
  ctx.fillStyle=g; ctx.fillText('GAME OVER', W/2, H/2-130);
  ctx.restore();

  // sad bear
  ctx.save();
  ctx.translate(W/2, H/2-6); ctx.scale(1.6,1.6);
  ctx.globalAlpha = 0.9;
  drawBear(1, 0, 1, 0, null, 1, t);
  ctx.restore();

  // score panel
  hudPanel(W/2-230, H/2+18, 460, 96, 16);
  textOut('SCORE', W/2-118, H/2+48, 'rgba(200,220,240,.8)', 13, 'center', 'rgba(0,0,0,.8)', 4);
  textOut(String(gs.score), W/2-118, H/2+82, '#ffffff', 30, 'center', 'rgba(0,0,0,.8)', 6);
  textOut('COINS', W/2, H/2+48, 'rgba(200,220,240,.8)', 13, 'center', 'rgba(0,0,0,.8)', 4);
  textOut(String(gs.coins), W/2, H/2+82, '#ffd94e', 30, 'center', 'rgba(0,0,0,.8)', 6);
  textOut('BEST', W/2+118, H/2+48, 'rgba(200,220,240,.8)', 13, 'center', 'rgba(0,0,0,.8)', 4);
  textOut(String(gs.highScore), W/2+118, H/2+82, '#7fe8ff', 30, 'center', 'rgba(0,0,0,.8)', 6);
  if (gs.score >= gs.highScore && gs.score > 0) {
    textOut('¡NUEVO RÉCORD!', W/2, H/2+134, '#ffd44e', 20, 'center', 'rgba(0,0,0,.85)', 5);
  }

  const btns=['TRY AGAIN','MAIN MENU'];
  for (let i=0;i<2;i++) {
    menuButton(W/2 + (i===0?-140:140), H/2+186, 254, 52, btns[i], i===goSel, t,
               '#ff9a7a', ['rgba(158,52,42,.96)','rgba(84,18,18,.96)'], 'rgba(255,110,80,.26)');
  }

  drawVignette(0.5);
  hintBar('← →  Seleccionar     ENTER  Confirmar');
}

// ── Main Loop ────────────────────────────────────────────────
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;
ctx.textBaseline = 'alphabetic';

// Scale canvas to window
function resize() {
  const scale = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
}
window.addEventListener('resize', resize); resize();

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  curDt = dt;
  const t = ts/1000;

  ctx.clearRect(0,0,W,H);

  switch(gs.scene) {
    case 'menu':
      updateMenu(dt); drawMenu(t, dt);
      break;
    case 'instructions':
      drawInstructions(t, dt);
      break;
    case 'worldmap':
      updateWorldMap(dt); drawWorldMap(t, dt);
      break;
    case 'gameplay':
      updateGameplay(dt); drawGameplay(t, dt);
      break;
    case 'pause':
      updatePause(dt); drawPause(t, dt);
      break;
    case 'gameover':
      updateGameOver(dt); drawGameOver(t);
      break;
  }

  clearFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
