name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The repository's Pages site is served from the `gh-pages` branch (legacy
# source), which already hosts another site at its root. To avoid clobbering
# it, this workflow publishes the runner game into the `runner/` subfolder and
# keeps every other file on the branch untouched.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site
          cp index.html style.css engine.js game.js site/

      - name: Publish to gh-pages/runner
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: runner
          keep_files: true
